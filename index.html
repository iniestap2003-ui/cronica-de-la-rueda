<h3>La conquista de Illian</h3>
<p>Rand engaña a todos, Cadsuane incluida, y ataca Illian solo con los Asha'man y la caballería de Bashere. Sammael traslada el combate a <b>Shadar Logoth</b> por un acceso, y allí <b>Mashadar lo devora</b>. En la ciudad muerta, los rayos de fuego compacto de Rand chocan con los de otro hombre al que no ve: <b>Moridin</b>. Rand vuelve a Illian y es coronado rey con la antigua Corona de Laurel, rehecha con espadas: <b>la Corona de Espadas</b>.</p>

<h3>Perrin se marcha</h3>
<p>Perrin se niega a mandar el ejército contra Illian. Tras una pelea escenificada con Rand, en apariencia desterrado, parte hacia <b>Ghealdan</b> para meter en cintura al Profeta Masema. Lleva a los hombres de Dos Ríos, aiel con Sabias, a Berelain y sus mayenianos, a las Aes Sedai juradas <b>Seonid</b> y <b>Masuri</b> y a dos Asha'man, <b>Grady</b> y <b>Neald</b>.</p>

<h3>Egwene en Murandy</h3>
<p>Egwene detiene la marcha del ejército rebelde en Murandy. Siente que un hombre que encauza le ha quitado el a'dam a Moghedien y avisa a su círculo. Rechaza el chantaje de Nicola y Areina, y Faolain y Theodrin le juran lealtad. Siuan descubre un campamento escondido donde <b>Myrelle y Nisao</b> ocultaban a <b>Lan</b>: Myrelle tiene su vínculo, que le pasó Moraine. Egwene obliga a las dos a jurarle obediencia y envía a Lan a buscar a Nynaeve. Halima se gana su confianza curándole sus dolores de cabeza.</p>

<h3>Ebou Dar: el Cuenco, las Allegadas y el gholam</h3>
<p>Nynaeve, Elayne y Aviendha negocian con el <b>Pueblo del Mar</b>, cuyas Detectoras de Vientos son encauzadoras. Mat sigue a un Amigo Siniestro hasta el palacio del inquisidor <b>Jaichim Carridin</b>, que recibe órdenes de Sammael de encontrar un alijo de <i>ter'angreal</i>. Mat avisa a las chicas, que se disculpan por cómo lo trataron en Tear y lo llevan a vivir al palacio. Allí la reina <b>Tylin</b> lo persigue y lo acaba metiendo en su cama, le guste o no.</p>
<p><b>Setalle Anan</b> lleva a Nynaeve y Elayne ante las <b>Allegadas</b>, una red secreta de mujeres que encauzan, fugitivas o expulsadas de la Torre, que llevan siglos escondidas. Su jefa es <b>Reanne Corly</b>. Saben dónde está el alijo, en el Rahad. <b>Moghedien</b>, ahora al servicio de Moridin, ataca la barca de Nynaeve con fuego compacto. Nynaeve, a punto de ahogarse, <b>rompe por fin su bloqueo</b> y ya no necesita estar furiosa para encauzar. Lan la saca del agua y <b>se casan</b>.</p>
<p>En el alijo se enfrentan a dos hermanas Negras, una de ellas Falion, y al <b>gholam</b>. El medallón de zorro de Mat lo rechaza. Encuentran el <b>Cuenco de los Vientos</b> y muchos otros objetos. Para usarlo hacen falta las Detectoras, y Elayne cierra con el Pueblo del Mar un trato que les cuesta muy caro, Mat incluido. Mientras busca a Olver, que se ha perdido, <b>los seanchan atacan Ebou Dar</b> y a Mat le cae un muro encima.</p>

<h3>Morgase y los seanchan</h3>
<p>Asunawa y Valda maltratan a Morgase. Los <b>seanchan conquistan Amador</b> y la Gran Señora Suroth la tiene en su poder. Para que no puedan usarla, Morgase <b>abdica</b> pronunciando las palabras irrevocables y huye con ayuda de <b>Sebban Balwer</b>, el secretario de Niall, y de sus fieles.</p>

<h3>La Torre de Elaida</h3>
<p>Elaida se entera de lo de Dumai's Wells. Alviarin la chantajea y la empuja a enfrentar a los Ajahs entre sí. Elaida encarga a <b>Seaine</b> buscar traidoras, y Seaine recluta a <b>Pevara</b> para cazar al Ajah Negro.</p>

<h3>Los shaido</h3>
<p>Sammael y Graendal, disfrazada, se reúnen con los shaido mientras Moridin los observa. Sammael le da a Sevanna una <b>Vara Juratoria</b> y dispersa a los shaido por varios reinos a través de accesos. Galina, presa de los shaido, acaba como <i>da'tsang</i>, la más baja de los sirvientes.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Cadsuane Melaidhrin</b>: Ajah Verde, temida hasta por las Aes Sedai.</li>
<li><b>Corlan Dashiva</b> y <b>Damer Flinn</b>: Asha'man.</li>
<li><b>Reanne Corly</b> y las Allegadas. <b>Renaile</b> y las Detectoras de Vientos.</li>
<li><b>Seaine</b> y <b>Pevara</b>: cazadoras de Negras en la Torre.</li>
<li><b>Darlin Sisnera</b>: tairense rebelde. <b>Sebban Balwer</b>: secretario, un espía nato.</li>
<li><b>Moridin</b>: hombre misterioso al que temen los propios Renegados.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Sammael</b>: muere en Shadar Logoth.</li>
<li><b>Moridin</b>: se deja ver. Moghedien le sirve, atada por una <i>cour'souvra</i>, una trampa mental.</li>
<li><b>Graendal</b>: manipula a los shaido.</li>
<li><b>Mesaana</b>: maneja a Alviarin dentro de la Torre.</li>
<li><b>Gholam</b>, <b>Falion</b> e <b>Ispan</b> (Ajah Negro), <b>Carridin</b>: en Ebou Dar.</li>
<li><b>Padan Fain</b>: hiere a Rand con la daga.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Toma de Illian</b>: Asha'man y caballería saldaeña.</li>
<li><b>El Retorno seanchan</b>: caen <b>Amador</b> y, al final, <b>Ebou Dar</b>. Ya dominan Tarabon.</li>
<li><b>Shaido dispersados</b> por accesos hacia Amadicia, Altara, Ghealdan y otros lugares.</li>
<li><b>Ejército rebelde</b> detenido en Murandy. Valda manda ya a los <b>Capas Blancas</b>.</li>
<li><b>Fuerza de Perrin</b>: de Cairhien hacia Ghealdan.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: engañar a su propio bando para sorprender a Sammael, y pactar con el Pueblo del Mar.</li>
<li><b>Egwene</b>: atar a las Asentadas con juramentos y secretos, y preparar el asedio de Tar Valon.</li>
<li><b>Elaida</b>: atacar la Torre Negra. Alviarin la tiene en un puño.</li>
<li><b>Los seanchan</b> conquistan reinos enteros y encadenan a toda mujer que encauza.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: rey de Illian. <b>Min</b> está con él y <b>Cadsuane</b> lo vigila.</li>
<li><b>Mat</b>: atrapado bajo un muro en Ebou Dar mientras entran los seanchan.</li>
<li><b>Nynaeve y Lan</b> (casados), <b>Elayne, Aviendha, Birgitte</b>: en Ebou Dar con el Cuenco, a punto de escapar.</li>
<li><b>Perrin y Faile</b>: camino de Ghealdan.</li>
<li><b>Egwene</b>: en Murandy. <b>Morgase</b>: huye de Amador.</li>
</ul>
`};

BOOKS[8]={n:8,t:"El camino de dagas",en:"The Path of Daggers",y:1998,era:"Año 1000 NE: por fin llega el invierno",html:`
<p class="lead">Elayne y los suyos escapan de Ebou Dar con el Cuenco de los Vientos mientras los seanchan toman la ciudad. Mat no sale en este libro: se recupera, herido, en la Ebou Dar ocupada.</p>

<h2>Prólogo</h2>
<p>Los cuatro monarcas de las Tierras Fronterizas, <b>Tenobia</b> de Saldaea, <b>Ethenielle</b> de Kandor, <b>Paitar</b> de Arafel y <b>Easar</b> de Shienar, renuevan un juramento de sangre y bajan hacia el sur con sus ejércitos para buscar a Rand. Han dejado la Llaga con pocas tropas. Verin, en secreto, usa la Compulsión con una hermana prisionera para que acabe al servicio de Rand.</p>

<h2>La trama</h2>
<h3>El Cuenco de los Vientos</h3>
<p>Aviendha abre un acceso y el grupo de Elayne sale de Ebou Dar con el gholam pisándoles los talones. En una granja de las Allegadas cerca de la ciudad, Aes Sedai, Detectoras de Vientos y Allegadas discuten por todo, incluida la custodia de <b>Ispan</b>, una Negra capturada. Al final <b>usan el Cuenco</b> en un gran círculo. El tiempo se arregla, vuelve el invierno y llega la nieve. En ese momento los seanchan atacan. Elayne deshace el acceso por el que huyen; el acceso estalla, mata a los perseguidores y a ella la deja herida. Elayne y Aviendha se adoptan como <b>hermanas primeras</b>.</p>
<p>Viajan a Andor. Por el camino asesinan a <b>Adeleas</b> y a Ispan: hay una Amiga Siniestra entre ellas. Elayne llega a Caemlyn y <b>reclama el Trono del León</b>. Empieza la guerra de sucesión. Nynaeve y Lan van con ella.</p>

<h3>Perrin en Ghealdan</h3>
<p>Perrin envía a Berelain a negociar con la reina <b>Alliandre</b>. Rescata de unos saqueadores del Profeta a un grupo de refugiados: una tal <b>"Maighdin"</b>, que es <b>Morgase</b> de incógnito, con Lini, Tallanvor, Basel Gill, Lamgwin, Breane y Balwer. Faile los toma como criados y Balwer se hace secretario de Perrin. <b>Elyas</b> reaparece y le da consejos de pareja. Alliandre jura lealtad a Perrin y a Rand. Las Sabias y la Aes Sedai Seonid quieren muerto al Profeta; Perrin se niega. En <b>Abila</b>, Perrin le dice a Masema que lo llevará ante Rand.</p>
<p>Al final, mientras van de caza, los <b>shaido de Sevanna capturan a Faile</b>, a Alliandre, a Maighdin, a Bain, a Chiad y a otras damas. Solo Berelain escapa. Galina, la Roja presa de los shaido, ha jurado obediencia a Sevanna con la Vara Juratoria.</p>

<h3>Rand contra los seanchan</h3>
<p>Rand obliga al ejército que fue de Sammael a unirse a él o desarmarse. La voz de Lews Therin se debilita y, al soltar el Poder, Rand empieza a ver doble. Taim informa de que la Torre Negra ya pasa de cuatrocientos alumnos y le manda cincuenta Asha'man con sus lugartenientes, <b>Gedwyn</b> y <b>Rochaid</b>. Narishma le trae Callandor. Con Bashere, los Asha'man y miles de tairenses, cairhieninos e illianos, Rand lanza una <b>campaña en Altara</b> contra los seanchan.</p>
<p>Gana las primeras batallas y los empuja hacia el oeste. Sobrevive a un atentado y a una flecha. En la gran batalla, a unas cincuenta millas de Ebou Dar, contra un ejército seanchan enorme, Rand usa <b>Callandor</b> él solo, pierde el control y sus rayos caen también sobre los suyos. Es una victoria tan cara que parece una derrota, y Rand se retira.</p>
<p>De vuelta en Cairhien se reencuentra con Min. Cadsuane acepta ser su consejera, con sus condiciones. Rand se ve obligado a matar con vino envenenado a <b>Fedwin Morr</b>, un joven Asha'man al que el combate le ha roto la mente. Varias Aes Sedai de Elaida prisioneras le juran lealtad. Entonces <b>Asha'man traidores</b>, Dashiva, Gedwyn, Rochaid y otros, intentan matarlo en el Palacio del Sol con una explosión. Fallan y huyen Viajando.</p>

<h3>Egwene: guerra contra Elaida y asedio de Tar Valon</h3>
<p>Llega la nieve. En el campamento rebelde desaparecen sirvientas y aparecen muertos; a Sheriam alguien le pega para interrogarla. Sobre un lago helado, Egwene se reúne con los nobles andoranos, que cierran el paso con su ejército, y con murandianos y Talmanes. Talmanes le cuenta que el rey Roedran de Murandy ha invitado a la Compañía. Egwene obliga a la Antecámara a votar la <b>guerra contra Elaida</b>. La Ley de Guerra le da autoridad para mandar por decreto. Su ejército <b>Viaja en un solo día hasta la llanura de Tar Valon</b>: empieza el asedio.</p>

<h3>La Torre de Elaida</h3>
<p>Alviarin chantajea a Elaida con lo del secuestro de Rand; Mesaana visita a Alviarin disfrazada. <b>Seaine y Pevara</b> desenmascaran a una hermana Negra, <b>Talene</b>, y le sacan nombres. Las hermanas que Elaida envió a destruir la Torre Negra, con la Roja <b>Toveine</b>, son escudadas y <b>vinculadas como Guardianas</b> por los Asha'man de Logain.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Los monarcas fronterizos</b>: Tenobia, Ethenielle, Paitar y Easar.</li>
<li><b>Alliandre</b>: reina de Ghealdan. <b>Maighdin</b> (Morgase disfrazada) y su séquito.</li>
<li><b>Gedwyn, Rochaid, Fedwin Morr, Narishma</b>: Asha'man.</li>
<li><b>Toveine</b>: Roja vinculada por un Asha'man. <b>Talene</b>: Negra desenmascarada.</li>
<li><b>Daved Hanlon</b>: Amigo Siniestro que se acerca a Elayne.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Moridin</b>: es el <b>Nae'blis</b>, y Graendal se entera de que debe obedecerle.</li>
<li><b>Asha'man renegados</b>: Dashiva, Gedwyn, Rochaid, Torval y Kisman.</li>
<li><b>Mesaana</b> y Alviarin, en la Torre. Hay una <b>Amiga Siniestra</b> infiltrada en el grupo de Elayne.</li>
<li><b>Gholam</b>: persigue al grupo del Cuenco.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Seanchan</b>: avanzan desde Ebou Dar hacia el este de Altara.</li>
<li><b>Campaña de Rand en Altara</b>: Asha'man, Bashere, tairenses, cairhieninos e illianos. Victoria muy costosa.</li>
<li><b>Ejército rebelde</b>: de Murandy a Tar Valon Viajando, y comienza el asedio.</li>
<li><b>Ejército andorano</b> de Pelivar y Arathelle en la frontera de Murandy.</li>
<li><b>Fronterizos</b>: bajan hacia el sur. <b>Shaido</b>: repartidos por Amadicia y Ghealdan; capturan a Faile.</li>
<li><b>Hombres de Logain</b>: neutralizan la expedición de la Torre contra la Torre Negra.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: frenar a los seanchan por la fuerza, sin contar con Callandor como contaba.</li>
<li><b>Elayne</b>: ganar Andor por derecho y no como regalo de Rand.</li>
<li><b>Egwene</b>: usar la Ley de Guerra para mandar sin depender de la Antecámara.</li>
<li><b>Perrin</b>: atar al Profeta y a Ghealdan a Rand.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: huido tras el atentado, con Min y Cadsuane cerca.</li>
<li><b>Elayne, Aviendha, Birgitte, Nynaeve, Lan</b>: en Caemlyn.</li>
<li><b>Perrin</b>: en Amadicia, junto a Abila, sin Faile.</li>
<li><b>Faile y Morgase</b>: cautivas de los shaido.</li>
<li><b>Egwene</b>: ante Tar Valon, empezando el asedio.</li>
<li><b>Mat</b>: herido, en Ebou Dar.</li>
</ul>
`};

BOOKS[9]={n:9,t:"El corazón del invierno",en:"Winter's Heart",y:2000,era:"Año 1000 NE, pleno invierno",html:`
<p class="lead">Faile está cautiva de los shaido y Perrin quiere recuperarla a cualquier precio. Elayne pelea por Andor. Mat sigue en la Ebou Dar seanchan. Rand tiene un plan desesperado: limpiar el <i>saidin</i>.</p>

<h2>Prólogo</h2>
<p>En la Torre, Seaine y Pevara someten a una Negra con la Vara Juratoria. En Caemlyn, Elayne contrata mercenarios y nombra a <b>Birgitte</b> capitana general de la Guardia Real. Rand nombra a <b>Dobraine</b> su administrador en Cairhien.</p>

<h2>La trama</h2>
<h3>Perrin persigue a los shaido</h3>
<p>Perrin sale de Abila con Elyas y jura recuperar a Faile cueste lo que cueste. En su campamento crecen las tensiones y corre el rumor de que se acuesta con Berelain. Masema llega con más hombres y se está viendo en secreto con los seanchan. Los exploradores aiel confirman que las cautivas siguen vivas y cerca, y que también hay seanchan por la zona.</p>
<p><b>Faile</b> es ahora <i>gai'shain</i> de <b>Rolan</b>, un aiel de los Mera'din, los "sin hermanos" que abandonaron a sus clanes. La obligan a correr desnuda por la nieve hasta caer agotada. Sevanna manda a Galina que cure a las cautivas, y la Sabia <b>Therava</b> las pone a espiar a Sevanna. Faile deja escapar sin querer que es la mujer de Perrin.</p>

<h3>Elayne en Caemlyn</h3>
<p>Elayne recorre Caemlyn con su nueva guardia de mujeres. Sus rivales al trono han sido liberados por alguien y el ejército de los fronterizos ha entrado en Andor. Rand le envía las <i>damane</i> y <i>sul'dam</i> seanchan capturadas, entre ellas <b>Alivia</b>, más fuerte que Nynaeve. Alguien envenena el té de Elayne con raíz de horcaria. La salva un guardia, <b>Doilin Mellar</b>, al que asciende; el lector sabe que es <b>Daved Hanlon</b>, un Amigo Siniestro. Dos Allegadas deducen que fue una Aes Sedai quien mató a Adeleas. Elayne deja que los fronterizos crucen Andor para buscar a Rand, y a Caemlyn llegan los ejércitos de sus rivales.</p>

<h3>Rand: el vínculo, Far Madding y la Limpieza</h3>
<p>Rand le pide a Nynaeve ayuda para algo enorme: <b>limpiar la mácula del <i>saidin</i></b> usando las dos llaves de acceso de Rhuidean, una para cada mitad, conectadas a los <b>Choedan Kal</b>, los dos <i>sa'angreal</i> más grandes jamás hechos. En Caemlyn, <b>Min, Aviendha y Elayne vinculan a Rand como Guardián</b>, las tres a la vez. Esa noche Elayne se acuesta con él. Rand se marcha con Nynaeve, Lan y Alivia.</p>
<p>Los Renegados se reúnen; entre ellos hay una nueva, <b>Cyndane</b>, de un poder enorme. Saben que Rand tiene las estatuillas.</p>
<p>Rand caza a los Asha'man traidores en <b>Far Madding</b>, una ciudad donde un <i>ter'angreal</i> antiguo impide encauzar. Mata a <b>Rochaid</b>; a Kisman lo mata Padan Fain. <b>Matador</b>, que en realidad son dos hombres en uno, Isam y Luc, falla al intentar matar a Rand y Min. Llega <b>Cadsuane</b>. Alanna exige saber quién más ha vinculado a Rand y se niega a soltarlo. Fain y Toram Riatin tienden una emboscada: <b>Lan mata a Toram</b>, y Fain acaba con los renegados que quedaban, Gedwyn y Torval, con su daga. Los Consejos de la ciudad encierran a Rand y Cadsuane lo saca de farol, con un <i>ter'angreal</i> en forma de colibrí que da acceso al Poder dentro de la ciudad.</p>
<p>En <b>Shadar Logoth</b>, Rand y Nynaeve se enlazan con las dos llaves y canalizan una cantidad de Poder nunca vista. Cadsuane, las Aes Sedai y los Asha'man los defienden de los Renegados que atacan. <b>Osan'gar</b>, el Renegado que se hacía pasar por el Asha'man Dashiva, muere. Shadar Logoth desaparece entera y la llave femenina queda destruida. <b>El <i>saidin</i> está limpio.</b></p>

<h3>Mat y la Hija de las Nueve Lunas</h3>
<p>Llega a Ebou Dar una joven seanchan de la Sangre, con velo: <b>Tuon</b>, la Hija de las Nueve Lunas. Mat le pide fuegos a <b>Aludra</b>, que le pone un acertijo sobre un fundidor de campanas, y planea irse con el espectáculo de Valan Luca. El gholam lo ataca y lo salva un viejo aventurero, <b>Noal Charin</b>. Mat esconde a la Aes Sedai <b>Joline</b> y le promete la libertad a <b>Teslyn</b>, ahora <i>damane</i>. <b>Egeanin</b>, investigada por los Buscadores de la Verdad, le pide ayuda junto con Bayle Domon y le consigue tres sul'dam de confianza: Bethamin, Seta y Renna.</p>
<p>La noche de la huida, Mat libera a varias <i>damane</i>. Descubre que Tuon es <b>la Hija de las Nueve Lunas</b>, aquella con la que los aelfinn le dijeron que se casaría, y se la lleva consigo. Huyen con Thom, Juilin, Noal, Olver, Egeanin, Domon y las Aes Sedai liberadas.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Tuon</b>: la Hija de las Nueve Lunas, heredera del Trono de Cristal. <b>Selucia</b>: su sirvienta.</li>
<li><b>Noal Charin</b>: viejo aventurero que ha visto medio mundo.</li>
<li><b>Alivia</b>: ex <i>damane</i>, muy poderosa. <b>Rolan</b>: aiel Mera'din. <b>Therava</b>: Sabia shaido.</li>
<li><b>Doilin Mellar</b> (Daved Hanlon). <b>Cyndane</b>: nueva Renegada.</li>
<li><b>Bethamin</b>, sul'dam. <b>Joline, Teslyn, Edesina</b>: Aes Sedai que huyen con Mat.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Ataque de los Renegados a la Limpieza</b>: fracasa. Muere Osan'gar.</li>
<li><b>Matador</b> (Isam y Luc) y <b>Padan Fain</b> rondan a Rand en Far Madding.</li>
<li><b>Asha'man renegados</b>: Rochaid muere a manos de Rand; Kisman, Gedwyn y Torval, a manos de Fain.</li>
<li><b>Mellar/Hanlon</b> y el Ajah Negro, escondidos en Caemlyn.</li>
<li><b>Gholam</b> en Ebou Dar. Masema pacta con los seanchan.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Fronterizos</b>: acampan en Andor buscando a Rand.</li>
<li><b>Pretendientes andoranos</b>: marchan sobre Caemlyn.</li>
<li><b>Fuerza de Perrin</b>: tras el rastro shaido, por Amadicia y Altara.</li>
<li><b>Asedio de Tar Valon</b> por los rebeldes de Egwene.</li>
<li><b>Seanchan</b>: dueños de Ebou Dar, Amador y Tarabon.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: arriesgarlo todo para limpiar el <i>saidin</i> y que los Asha'man no enloquezcan.</li>
<li><b>Elayne</b>: ganar Casas una a una y no pelear contra los fronterizos.</li>
<li><b>Mat</b>: huir hacia el norte usando a Tuon como garantía.</li>
<li><b>Perrin</b>: aliarse con quien haga falta para recuperar a Faile.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand, Nynaeve, Lan, Min, Cadsuane</b>: en las ruinas de Shadar Logoth, con el <i>saidin</i> limpio.</li>
<li><b>Elayne y Aviendha</b>: en Caemlyn, con los ejércitos de sus rivales a las puertas.</li>
<li><b>Mat y Tuon</b>: huyendo de Ebou Dar hacia el norte, con el espectáculo de Luca.</li>
<li><b>Perrin</b>: tras los shaido. <b>Faile</b>: <i>gai'shain</i>.</li>
<li><b>Egwene</b>: asediando Tar Valon.</li>
</ul>
`};

BOOKS[10]={n:10,t:"Encrucijada en el crepúsculo",en:"Crossroads of Twilight",y:2003,era:"Año 1000 NE: los días de la Limpieza y las semanas siguientes",html:`
<p class="lead">El libro vuelve atrás en el tiempo: buena parte transcurre a la vez que la Limpieza de Shadar Logoth, contada desde los demás personajes, que ven en el horizonte un torrente de Poder sin saber qué es. Luego avanza unas semanas.</p>

<h2>Prólogo</h2>
<p><b>Rodel Ituralde</b>, el gran general domani, se reúne en secreto con Juramentados del Dragón para hostigar a los seanchan. <b>Eamon Valda</b> reúne a los Lores Capitanes de los Capas Blancas que quedan. En la Torre, las cazadoras de Negras presionan a una hermana para que espíe a Elaida. Las Aes Sedai vinculadas por los hombres de Logain se preparan para salir con él a reclutar.</p>

<h2>La trama</h2>
<h3>Perrin: la sombra de lo que haría por Faile</h3>
<p>Veintidós días después del secuestro, Perrin tiene sueños que inquietan a los lobos y encuentra rastros de <b>sabuesos oscuros</b> alrededor del campamento. Todo indica que <b>Masema</b> se reúne en secreto con los seanchan y con Aes Sedai. Berelain le enseña un salvoconducto seanchan que le ha robado al Profeta. Elyas informa de que el campamento shaido, junto a la ciudad de <b>Malden</b>, los supera cinco a uno. En <b>So Habor</b> buscan provisiones entre grano lleno de gorgojo y una ciudad con fantasmas. Para sacar información a un prisionero shaido, <b>Perrin le corta la mano</b>. Después tira su hacha, avergonzado. Tallanvor vuelve con noticias: los seanchan podrían ayudarles contra los shaido.</p>

<h3>Faile en el campamento shaido</h3>
<p>Las Sabias shaido interrogan a Faile. Rolan la salva de una agresión. <b>Maighdin</b> (Morgase) intenta robar la Vara Juratoria que Sevanna usa con Galina. Dos de las damas de Faile intentan escapar y las vuelven a capturar, y Faile recibe un castigo. Faile sigue preparando la fuga.</p>

<h3>Mat y Tuon</h3>
<p>Mat recuerda la salida de Ebou Dar: las Aes Sedai disfrazadas de <i>damane</i> y él y Egeanin haciéndose pasar por amantes ante la guardia. Ahora todos se esconden en el espectáculo de Luca, más grande que nunca. Mat y Egeanin se disputan el mando. <b>Tuon</b> llama a Mat "Juguete", juega con él a las piedras y le pregunta cosas desconcertantes. Mat descubre que las palabras que dijo al raptarla <b>equivalen a medio matrimonio</b> según la costumbre seanchan. Y descubre algo más: Tuon fue sul'dam y, por tanto, podría aprender a encauzar.</p>
<p>Un Buscador de la Verdad convence a <b>Furyk Karede</b>, de la Guardia de la Muerte, de que Tuon corre peligro, y Karede sale a buscarla. En Jurador, <b>Renna</b> apuñala a Egeanin y huye hacia una guarnición seanchan; <b>Mat la mata</b> antes de que llegue. Tuon le revela a Luca quién es y pone su espectáculo bajo su protección.</p>

<h3>Elayne y la guerra por Andor</h3>
<p>Elayne gana apoyos Casa por Casa mientras <b>Arymilla Marne</b> y sus aliados asedian Caemlyn. Al sentir el "faro" de Poder de la Limpieza, Aviendha la convence de no salir corriendo hacia él. Birgitte se queja de lo pocos que son los reclutas. Elayne riñe a "Mellar" por hacer salidas sin permiso. La Señora de las Olas <b>Zaida</b>, del Pueblo del Mar, le anuncia que ha muerto la Señora de los Barcos y se marcha a elegir sucesora, pero deja a sus Detectoras ayudando a cambio de tierras. Las Sabias le confirman a Elayne que está <b>embarazada de gemelos</b>; el padre, que es Rand, se mantiene en secreto. Mientras, Daved Hanlon asesina a un espía y da cuenta a <b>Shiaine</b>, una Amiga Siniestra.</p>

<h3>Egwene: el puerto y la captura</h3>
<p>El asedio se estanca porque siguen entrando barcos en Tar Valon. Egwene planea bloquear los puertos convirtiendo sus cadenas en <i>cuendillar</i>. En el campamento, la comida se pudre, y las novicias, entre ellas <b>Bode Cauthon</b>, la hermana de Mat, fabrican objetos de <i>cuendillar</i> para vender. Siuan advierte una pauta sospechosa: tanto en una Antecámara como en la otra se han elegido Asentadas demasiado jóvenes. Solo Halima consigue aliviar los dolores de cabeza de Egwene. Las rebeldes ven ahora un agujero de tres millas donde estaba Shadar Logoth, y la Asentada <b>Moria</b> propone vincular a hombres que encauzan para hacer círculos más fuertes. Asesinan con <i>saidin</i> a <b>Anaiya</b> y a su Guardián, y después a otra hermana, Kairen Stang, que iba a encargarse de una de las cadenas.</p>
<p>Egwene va ella misma al <b>Puerto Norte</b>, convierte la cadena en <i>cuendillar</i> y <b>la capturan hermanas de la Torre</b>.</p>

<h3>La Torre de Elaida</h3>
<p>Alviarin vuelve y se encuentra con que <b>Tarna Feir</b> la ha sustituido como Guardiana de las Crónicas. Presencia cómo <b>Shaidar Haran</b> castiga a Mesaana y a ella le deja una marca invisible en la frente. Tarna, que ha visto la Torre Negra, propone a la Roja <b>Pevara</b> que su Ajah vincule Asha'man.</p>

<h3>Rand</h3>
<p>Cadsuane estudia a las Aes Sedai vinculadas a Asha'man y a Alivia. <b>Bashere, Logain y Loial</b> encuentran a Rand. Logain le advierte de que no se fíe de Taim. Rand decide buscar una <b>tregua con los seanchan</b> y los envía a negociar. En el epílogo regresan: los seanchan aceptan, pero exigen que el Dragón se reúna con <b>la Hija de las Nueve Lunas</b>.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Rodel Ituralde</b>: uno de los grandes capitanes, domani.</li>
<li><b>Furyk Karede</b>: Guardia de la Muerte seanchan.</li>
<li><b>Arymilla Marne</b>: aspirante al Trono del León. <b>Shiaine</b>: Amiga Siniestra en Caemlyn.</li>
<li><b>Zaida</b>: Señora de las Olas del Pueblo del Mar.</li>
<li><b>Bode Cauthon</b>: hermana de Mat, novicia rebelde.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Sabuesos oscuros</b> rodean a Perrin. <b>Masema</b> juega a dos bandos.</li>
<li><b>Asesinatos con saidin</b> en el campamento rebelde: Anaiya y Kairen Stang.</li>
<li><b>Shaidar Haran</b> castiga a Mesaana y marca a Alviarin.</li>
<li><b>Hanlon y Shiaine</b> conspiran en Caemlyn.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Shaido en Malden</b>, con miles de cautivos.</li>
<li><b>Fuerza de Perrin</b>: de Amadicia a So Habor y luego cerca de Malden.</li>
<li><b>Asedio de Caemlyn</b> por Arymilla. <b>Asedio de Tar Valon</b> por los rebeldes.</li>
<li><b>Ituralde</b> y los Juramentados del Dragón empiezan a golpear a los seanchan en Tarabon y Arad Doman.</li>
<li><b>Capas Blancas</b> de Valda, reagrupándose.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Perrin</b>: cualquier alianza vale, incluso con los seanchan, si le devuelve a Faile.</li>
<li><b>Egwene</b>: cerrar los puertos para rendir Tar Valon por hambre.</li>
<li><b>Rand</b>: una tregua con los seanchan para tener las manos libres ante la Última Batalla.</li>
<li><b>Elayne</b>: conseguir el apoyo de diez Casas antes de que caiga Caemlyn.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Egwene</b>: prisionera en la Torre Blanca.</li>
<li><b>Perrin</b>: cerca de Malden, a punto de pactar con los seanchan. <b>Faile</b>: cautiva en Malden.</li>
<li><b>Mat y Tuon</b>: con el espectáculo de Luca, cerca de Jurador.</li>
<li><b>Elayne</b>: en Caemlyn, sitiada y embarazada.</li>
<li><b>Rand</b>: espera la reunión con la Hija de las Nueve Lunas.</li>
</ul>
`};

BOOKS[11]={n:11,t:"Cuchillo de sueños",en:"Knife of Dreams",y:2005,era:"Año 1000 NE",html:`
<p class="lead">El último libro que escribió Robert Jordan entero, y el que más tramas cierra. Los muertos caminan, los pasillos cambian de sitio y aparecen trollocs donde no debería haberlos: la Última Batalla se acerca.</p>

<h2>Prólogo</h2>
<p><b>Galad</b> reta a <b>Eamon Valda</b> por lo que le hizo a Morgase, lo mata en duelo y se convierte en <b>Lord Capitán Comandante</b> de los Capas Blancas. <b>Ituralde</b> prepara sus golpes contra los seanchan. Semirhage asesina a la familia imperial seanchan en su tierra. Gaul y el Asha'man Neald secuestran a Galina para Perrin. Egwene, capturada, es <b>degradada a novicia</b>.</p>

<h2>La trama</h2>
<h3>Perrin: la batalla de Malden</h3>
<p>Perrin pacta con la Abanderada General seanchan <b>Tylee Khirgan</b>: un ataque conjunto contra los shaido de <b>Malden</b>, a cambio de que los seanchan se queden con las encauzadoras shaido. Su plan es echar <b>raíz de horcaria</b> en el acueducto de la ciudad para que las Sabias no puedan encauzar. Sobrevive a un atentado. <b>Tam al'Thor</b> llega con refuerzos de Dos Ríos.</p>
<p>Dentro, Faile ha conseguido la Vara Juratoria de Sevanna. Galina, que le prometió ayuda, las traiciona y las encierra en un sótano. <b>Maighdin</b> encauza para que las encuentren. Rolan, que protegía a Faile, se la intenta llevar al Yermo. Llega el asalto: shaido drogados, aiel de Perrin, seanchan con <i>damane</i> y <i>raken</i>. <b>Aram</b>, el gitano, que se había vuelto un fanático del Profeta, intenta matar a Perrin y muere. Perrin mata a Rolan en el combate. <b>Faile es libre.</b> Los shaido quedan destrozados y los seanchan se llevan a <b>Sevanna</b> y a muchas Sabias encadenadas. Therava se lleva a Galina.</p>

<h3>Mat: matrimonio y Príncipe de los Cuervos</h3>
<p>Con el espectáculo de Luca, Mat corteja a Tuon, a la que ahora llama "Preciosa", le regala una navaja y comprueba que el Poder no puede tocarlo. Deja marchar a las Aes Sedai y entierra los a'dam. <b>Egeanin y Bayle Domon se casan.</b> Aludra le explica a Mat sus "huevos de dragón" y unos tubos para lanzarlos, los futuros <b>dragones</b>: a cambio necesita fundidores de campanas. Thom le enseña una carta de Moraine: <b>Moraine está viva, prisionera de los aelfinn y los eelfinn</b>, y pide que la rescaten. Olver sabe cómo entrar en la Torre de Ghenjei y Mat, Thom y Noal lo planean.</p>
<p>Mat deja el espectáculo y se reúne con <b>Talmanes</b> y la Compañía. Karede, de la Guardia de la Muerte, llega a su campamento, y Mat acepta entregarle a Tuon si la escoltan con seguridad. Entonces <b>Tuon declara tres veces que Mat es su marido</b> y el matrimonio queda completo. Con la Compañía y los ingenios de Aludra, Mat <b>derrota a un ejército seanchan</b> en Altara. Tuon le da un título: <b>Príncipe de los Cuervos</b>. Ella vuelve a Ebou Dar y desbarata los planes de Suroth.</p>

<h3>Rand: la mansión de Algarin y la mano perdida</h3>
<p>En la mansión del noble tairense Algarin, Rand escucha las noticias. Logain insiste en que Taim es un Amigo Siniestro. Llegan la madre de Loial, el Mayor Haman y Erith, y <b>Loial y Erith se casan</b>. Entonces <b>cien mil trollocs</b> atacan la mansión. <b>Lews Therin toma el control</b> y los aniquila, y solo devuelve el mando cuando Rand le promete que morirán en la Última Batalla. Verin se marcha advirtiéndole que no confíe en las Aes Sedai. Loial va a hablar al Gran Tocón para pedir que los ogier luchen.</p>
<p>Rand Viaja a la Ciudadela de Tear, sitiada por los rebeldes, y acuerda que <b>Darlin</b> sea rey. Rand acepta que 47 Aes Sedai rebeldes puedan vincular Asha'man. En las islas del Pueblo del Mar, los amayar se suicidan en masa.</p>
<p>Por fin llega la cita con los seanchan, y el enviado de la Hija de las Nueve Lunas resulta ser <b>Semirhage</b> disfrazada. Lews Therin y Rand se pelean por el control del cuerpo en mitad del combate, y Semirhage <b>le quema a Rand la mano izquierda</b>. Al final la capturan.</p>

<h3>Lan y la Grulla Dorada</h3>
<p>Lan quiere ir solo a morir al Paso de Tarwin. <b>Nynaeve</b> le hace prometer que aceptará a todo el que quiera acompañarlo, y lo deja en el <b>Fin del Mundo</b>, en el extremo oeste de Saldaea. Luego recorre las Fronteras avisando a los malkieri: la <b>Grulla Dorada</b> vuelve a cabalgar.</p>

<h3>Elayne gana Andor</h3>
<p>Caemlyn resiste el asedio usando accesos para mover tropas. Aviendha descubre una vieja daga que oculta a quien la lleva de la mirada de la Sombra. Los pasillos del palacio cambian de sitio solos. Elayne hace que un ladrón, Hark, siga a Mellar hasta una casa. La Aes Sedai <b>Careane</b> resulta ser Negra y la mata Vandene. Mueren varias hermanas y <b>Elayne cae en manos del Ajah Negro</b>. Birgitte y las Detectoras de Vientos la rescatan. Elayne ataca por la retaguardia el ejército de <b>Arymilla</b>, que cae prisionera. Usando como palanca a los fronterizos acampados en Andor, consigue el apoyo de casi todas las Casas: es <b>reina de Andor</b>.</p>

<h3>Egwene en la Torre</h3>
<p>Por medio de Siuan, Egwene prohíbe a las rebeldes que intenten rescatarla. Egwene, novicia a la fuerza, aguanta palizas diarias y raíz de horcaria sin quejarse y se gana a las novicias y a muchas hermanas. Sigue actuando como Amyrlin desde dentro. La rebelde <b>Beonin</b> se pasa a Elaida y le revela cómo Viajar, delatando a las espías rebeldes. Halima y Delana huyen del campamento rebelde. Elaida tiene preso al antiguo rey de Illian.</p>

<h3>Epílogo</h3>
<p>Pevara llega a la Torre Negra y Taim acepta, para sorpresa de todos, que las Rojas vinculen Asha'man.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Tylee Khirgan</b>: general seanchan. <b>Mishima</b>: su segundo.</li>
<li><b>Algarin</b>: noble tairense. <b>Covril</b>: madre de Loial.</li>
<li><b>Samwil Hark</b>: ladrón que espía a Mellar.</li>
<li>Los <b>malkieri</b> que se suman a Lan.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Semirhage</b>: le quita la mano a Rand y la capturan. Antes había matado a la Emperatriz seanchan y su familia.</li>
<li><b>Moridin</b> reúne a los Renegados en Tel'aran'rhiod: Rand es para él; a Mat y Perrin hay que matarlos.</li>
<li><b>Ajah Negro</b> en Caemlyn: Careane, Chesmal, Falion y otras. <b>Halima</b> (Aran'gar) huye.</li>
<li><b>Ataque trolloc</b> a la mansión de Algarin, aniquilado.</li>
<li><b>Galina</b>, Negra, traiciona a Faile.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Batalla de Malden</b>: Perrin, Dos Ríos, aiel, mayenianos, Asha'man y seanchan contra los shaido.</li>
<li><b>Mat contra los seanchan</b> en Altara: victoria de la Compañía.</li>
<li><b>Hueste trolloc</b> contra la mansión de Algarin: destruida por Lews Therin.</li>
<li><b>Ataque final de Arymilla</b> contra Caemlyn: derrotada.</li>
<li><b>Fronterizos</b> en Andor. <b>Ituralde</b> golpea a los seanchan en Tarabon.</li>
<li><b>Malkieri</b>: empiezan a reunirse tras Lan desde Saldaea.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Perrin</b>: aliarse con el enemigo de su enemigo y neutralizar a las Sabias shaido con horcaria.</li>
<li><b>Tuon</b>: quedarse con Mat, que es su presagio, y volver a recuperar el mando.</li>
<li><b>Egwene</b>: derribar a Elaida desde dentro, demostrando lo que vale cada día.</li>
<li><b>Nynaeve</b>: convertir el viaje suicida de Lan en un ejército.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: manco, en Tear, con Semirhage prisionera.</li>
<li><b>Perrin y Faile</b>: juntos otra vez, en Malden.</li>
<li><b>Mat</b>: casado con Tuon, con la Compañía en Altara. <b>Tuon</b>: de vuelta en Ebou Dar.</li>
<li><b>Elayne</b>: reina de Andor. <b>Egwene</b>: novicia en la Torre, en guerra silenciosa con Elaida.</li>
<li><b>Lan</b>: cabalga hacia el este por las Fronteras. <b>Nynaeve</b>: vuelve con Rand.</li>
<li><b>Galad</b>: al mando de los Capas Blancas. <b>Loial</b>: hacia el Gran Tocón.</li>
</ul>
`};

BOOKS[12]={n:12,t:"La tormenta",en:"The Gathering Storm",y:2009,era:"Año 1000 NE",html:`
<p class="lead">El primero que termina Brandon Sanderson a partir de las notas de Jordan. Se centra en Rand, que se está endureciendo hasta parecer de piedra, y en Egwene, que lucha por reunificar la Torre.</p>

<h2>Prólogo</h2>
<p>Todos se mueven hacia la Última Batalla. Ituralde tiende una emboscada a un ejército seanchan gigantesco. Mientras Masema huye de Malden, la gente de Faile lo embosca y <b>mata al Profeta</b>, sin que Perrin lo sepa.</p>

<h2>La trama</h2>
<h3>Rand en Arad Doman</h3>
<p>Rand intenta restaurar el orden en <b>Arad Doman</b>, sin rey y en guerra civil, mientras busca a <b>Graendal</b>, que se esconde allí. Los aiel de Rhuarc controlan <b>Bandar Eban</b>. Cadsuane y Sorilea interrogan a <b>Semirhage</b> sin conseguir nada, hasta que Cadsuane la humilla dándole unos azotes. Con el <i>saidin</i> limpio, Rand acaba con la norma de que los Asha'man enloquecidos debían suicidarse. Encuentra a <b>Ituralde</b> a punto de morir en una última resistencia, le impone la paz con su peso de <i>ta'veren</i> y lo envía a proteger las Tierras Fronterizas.</p>
<p>En sueños, Rand se ve con <b>Moridin</b> y lo reconoce: es <b>Ishamael</b> renacido. Min encuentra en las notas de Herid Fel una pista: para reparar la prisión del Oscuro <b>habrá que romper los sellos</b>.</p>
<p>Shaidar Haran libera a Semirhage y la Negra <b>Elza</b> le da una <b>Banda de Dominación</b>, con la que somete a Rand. Semirhage le obliga a estrangular a Min. Desesperado, sin poder encauzar, Rand toma el <b>Poder Verdadero</b>, la energía del propio Oscuro, rompe la banda y <b>destruye con fuego compacto a Semirhage y a Elza</b>. Desde ese momento decide ser de acero, sin sentimientos. <b>Destierra a Cadsuane</b> bajo pena de muerte porque fue ella quien dejó la banda al alcance de Semirhage.</p>
<p>En Bandar Eban, el Pueblo del Mar trae comida. Nynaeve destapa un envenenamiento en el palacio, y Rand le quita la Compulsión de la mente al culpable, un pobre aprendiz llamado Kerb, que le revela dónde está Graendal: en la fortaleza de <b>Natrin's Barrow</b>. Rand se reúne con <b>Tuon en Falme</b> agarrando la llave de acceso. Ella ve en él una oscuridad y rechaza la tregua. Rand vuelve y <b>arrasa Natrin's Barrow con fuego compacto</b> a través de la llave: mata a todos los que había dentro, prisioneros incluidos. Cree que Graendal ha muerto. Min y Nynaeve quedan horrorizadas. Luego toda la comida guardada en Arad Doman se pudre de golpe y Rand abandona el país derrotado.</p>

<h3>Rand en el borde del abismo</h3>
<p>Nynaeve, siguiendo un plan de Cadsuane, trae a <b>Tam</b> para hablar con su hijo. Rand pierde el control y <b>está a punto de matar a su padre</b>, y huye horrorizado por un acceso. Min y Cadsuane deducen que <b>Callandor</b> tiene un defecto oculto: solo debe usarse en un círculo con dos mujeres que guíen. Tam dice que Rand ha ido a <b>Ebou Dar</b> a destruir a los seanchan.</p>
<p>Allí Rand se dispone a borrar la ciudad entera, pero se le revuelve el estómago al tomar el <i>saidin</i> y no lo hace. Va al <b>Monte del Dragón</b>, el lugar donde murió y nació, decidido a destruirlo todo con la llave. En el último instante, la voz cuerda de Lews Therin le recuerda que vivir otra vez es una segunda oportunidad. Rand <b>destruye el Choedan Kal</b>, acepta los recuerdos de Lews Therin y ríe por primera vez en mucho tiempo. Las nubes se abren sobre el Monte del Dragón.</p>

<h3>Egwene: la Torre vuelve a ser una</h3>
<p>Novicia a la fuerza, Egwene aguanta los castigos y se gana a las hermanas con argumentos. Las cazadoras de Negras la buscan. Seaine reconoce que Elaida no es una Amyrlin legal. Egwene denuncia en público a Elaida, que la acusa de Amiga Siniestra y la encierra. La Torre se pudre por dentro: burbujas de maldad, Ajahs que se odian, pasillos que se mueven.</p>
<p>Entonces <b>Verin</b> la visita y le revela que es del <b>Ajah Negro</b>: entró para estudiarlo y nunca juró sobre la Vara. Se toma un veneno y, en su última hora, le entrega a Egwene sus diarios: <b>cientos de nombres de Negras</b>.</p>
<p>Los seanchan atacan la Torre de noche con <i>raken</i>, <i>damane</i> y unos asesinos llamados Cuchillos de Sangre. Egwene organiza a las novicias en círculos y, con un poderoso <i>sa'angreal</i>, <b>rechaza el ataque</b>. Siuan, Gawyn y Bryne la sacan de la Torre contra su voluntad. <b>Elaida es capturada por los seanchan</b> y se convierte en <i>damane</i>.</p>
<p>De vuelta con las rebeldes, Egwene obliga a todas a volver a jurar sobre la Vara: caen <b>Sheriam</b> y otras. Ejecutan a cincuenta Negras y otras veinte huyen. Las de la Torre le ofrecen el báculo: <b>Egwene es elevada como Amyrlin de una Torre reunida</b>, restaura el Ajah Azul y nombra Guardiana a la Roja <b>Silviana</b> como gesto de reconciliación.</p>

<h3>Mat, Perrin, Aviendha, Tuon</h3>
<p>Mat lleva la Compañía hacia Caemlyn pensando en la Torre de Ghenjei. En el pueblo maldito de <b>Hinderstap</b>, los vecinos enloquecen y se matan cada noche, y al amanecer vuelven a la vida sin recordar nada. Ven carteles con las caras de Mat y Perrin: alguien paga por ellos. <b>Verin</b> le da a Mat una carta sellada que no debe abrir en un tiempo.</p>
<p>Perrin sale de Malden y lleva al norte a miles de refugiados. Saltador lo echa del sueño del lobo y se reconcilia con Faile. <b>Aviendha</b> es aceptada como Sabia y la envían a Rhuidean. <b>Tuon</b> se entera de la muerte de la Emperatriz y se proclama <b>Emperatriz Fortuona</b>, con Selucia como Portavoz de la Verdad, y autoriza el ataque a la Torre.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Elza Penfell</b>: Aes Sedai jurada a Rand y Negra. <b>Kerb</b>: víctima de Graendal.</li>
<li><b>Silviana</b>: Maestra de las Novicias y luego Guardiana. <b>Katerine</b>: nueva Maestra de las Novicias de Elaida.</li>
<li><b>Fortuona</b>: el nombre de Tuon como Emperatriz.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Semirhage</b>: muere. <b>Graendal</b>: Rand la cree muerta en Natrin's Barrow.</li>
<li><b>Moridin</b> es Ishamael renacido.</li>
<li><b>Verin</b>: era Negra, pero traiciona a la Sombra y se mata para darle a Egwene la lista.</li>
<li><b>Sheriam</b> y otras cincuenta Negras: ejecutadas. Mesaana sigue escondida.</li>
<li><b>El Poder Verdadero</b>: Rand lo ha tocado.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Ituralde contra los seanchan</b> en Arad Doman. Rand lo envía después a las Fronteras.</li>
<li><b>Ataque seanchan a la Torre Blanca</b>: rechazado por Egwene.</li>
<li><b>Aiel en Arad Doman</b>. <b>Refugiados de Perrin</b> marchando al norte.</li>
<li><b>Compañía de la Mano Roja</b> hacia Andor.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: hacerse de acero para aguantar. Al final, aceptar que hay que sentir.</li>
<li><b>Egwene</b>: no huir de la Torre, sino conquistarla desde dentro.</li>
<li><b>Fortuona</b>: golpear a la Torre y tratar a Rand como a un enemigo.</li>
<li><b>Los sellos</b>: empieza a cobrar fuerza la idea de romperlos.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: en el Monte del Dragón, en paz consigo mismo y con los recuerdos de Lews Therin.</li>
<li><b>Egwene</b>: Amyrlin en Tar Valon, con Gawyn y Siuan.</li>
<li><b>Mat</b>: hacia Caemlyn. <b>Perrin</b>: hacia el norte con su ejército.</li>
<li><b>Aviendha</b>: hacia Rhuidean. <b>Tuon</b>: Emperatriz en Ebou Dar.</li>
<li><b>Elaida</b>: <i>damane</i> de los seanchan.</li>
</ul>
`};

BOOKS[13]={n:13,t:"Torres de medianoche",en:"Towers of Midnight",y:2010,era:"Año 1000 NE: las semanas antes de la Última Batalla",html:`
<p class="lead">Rand ha bajado del Monte del Dragón cambiado: sereno, con los recuerdos de Lews Therin y una calma que cura la tierra a su paso. La Sombra ya ataca abiertamente las Tierras Fronterizas. Todos los caminos llevan al Campo de Merrilor.</p>

<h2>Prólogo</h2>
<p><b>Lan</b> cabalga por Saldaea con un solo acompañante y cada vez se le unen más malkieri. <b>Graendal</b>, que no había muerto, huye. <b>Padan Fain</b> camina por la Llaga, convertido en algo distinto y peor. En las Fronteras todo anuncia el ataque.</p>

<h2>La trama</h2>
<h3>Rand: el Dragón renacido de verdad</h3>
<p>Un granjero, <b>Almen Bunt</b>, ve cómo los manzanos marchitos dan fruta al paso de Rand. Rand entra en la Torre Blanca, escudado por círculos, y anuncia que <b>romperá los sellos de la prisión del Oscuro</b>. Egwene se opone y lo cita en el <b>Campo de Merrilor</b> para dentro de un mes, mientras busca apoyos contra el plan.</p>
<p>En Tear, Rand se reencuentra con Min, pide perdón a los aiel y a Nynaeve, desenmascara Amigos Siniestros entre los nobles tairenses y <b>hace las paces con Tam</b>. Nynaeve cura la locura de un Asha'man y, tras oír sus razones, acepta apoyarle. Rand vuelve a <b>Bandar Eban</b> con Min, abre las nubes, trae Curadoras y hace aparecer comida en almacenes podridos. En <b>Maradon</b> (Saldaea), donde <b>Ituralde</b> lleva semanas resistiendo hordas de trollocs, Señores del Espanto y Draghkar lanzados como proyectiles, el ejército saldaeño de Bashere llega a tiempo y Rand <b>mata a miles de engendros él solo</b>. Pero no puede salvar Kandor ni Arafel, invadidas.</p>
<p>En <b>Far Madding</b>, los cuatro monarcas fronterizos lo ponen a prueba: le dan una bofetada cada uno y le hacen una pregunta cuya respuesta solo Lews Therin podría saber. La aprueba. En <b>Cairhien</b> le cede el Trono del Sol a Elayne. Sueña con una mujer torturada que le suplica: es <b>Mierin, Lanfear</b>.</p>

<h3>Perrin: juicio, martillo y lobo</h3>
<p>Perrin avanza por Ghealdan con un ejército de refugiados y aliados y choca con los <b>Capas Blancas</b>, ahora mandados por <b>Galad</b>, a quien sus hombres han liberado de los Inquisidores matando a Asunawa. <b>Jaret Byar</b> y <b>Dain Bornhald</b> acusan a Perrin de matar Capas Blancas años atrás. Galad descubre a <b>Morgase</b> entre los refugiados, y todos aceptan un juicio según la ley andorana con Morgase como jueza. Morgase lo declara culpable de <b>homicidio ilegal, no de asesinato</b>, y Galad aplaza la sentencia hasta después de la Última Batalla.</p>
<p>Moridin encarga a Graendal matar a Perrin y le da un <i>ter'angreal</i>, un <b>clavo de sueño</b>, que impide Viajar y atrapa al ejército bajo una cúpula violeta. Matador lo planta. Perrin aprende de Saltador a dominar el sueño del lobo y a controlar su lado lobo. En el sueño se enfrenta a Matador cerca de Tar Valon; <b>Saltador muere</b> para siempre. Perrin se lleva el clavo huyendo de Matador y al final lo destruye en un volcán de pesadilla. Con ayuda de Neald y las Sabias, <b>forja un martillo con el Poder: Mah'alleinir</b>. Acepta por fin mandar a su gente.</p>
<p>Graendal hace caer sobre los Capas Blancas un ejército trolloc. <b>Perrin los salva</b>, y Galad le impone como pena una compensación y su promesa de luchar en la Última Batalla. Byar intenta matar a Perrin y <b>Dain Bornhald mata a Byar</b>. Galad se pone a las órdenes de Perrin. Tallanvor pide la mano a Morgase. Al final de sus pruebas, Perrin descubre que el lobo <b>Ilimitado</b> es <b>Noam</b>, el hombre perdido en el lobo que vio en Jarra.</p>

<h3>Mat: el gholam y la Torre de Ghenjei</h3>
<p>En Caemlyn, Mat se entera de que Elayne espera gemelos de Rand. El gholam mata a sus hombres. Mat negocia con Elayne: ella pone fundidores y dinero para los <b>dragones</b> de Aludra a cambio de que la Compañía sirva a Andor, y Mat le presta su medallón para que haga copias. Con <b>Talmanes</b> y las copias del medallón, Mat acorrala al gholam en un edificio en llamas y lo echa por un acceso al vacío de Transitar.</p>
<p>Con <b>Thom</b> y <b>Noal</b> entra en la <b>Torre de Ghenjei</b> siguiendo las reglas de "serpientes y zorros": fuego, música y hierro. Encuentran a <b>Moraine</b>. Mat <b>entrega su ojo izquierdo</b> a los eelfinn a cambio de un paso seguro, pero se le olvida pedir una salida. Los aelfinn los persiguen y Noal se queda a contenerlos: era <b>Jain Farstrider</b>, el aventurero legendario. Mat abre una salida con su lanza. Moraine, débil, cuenta que los eelfinn dicen haber matado a Lanfear, y ella y Thom se confiesan su amor.</p>

<h3>Egwene: Mesaana</h3>
<p>Aes Sedai de la Torre mueren asesinadas. Gawyn descubre que los culpables son <b>Cuchillos de Sangre</b> seanchan con anillos-<i>ter'angreal</i> que los vuelven invisibles. Egwene le tiende una trampa a Mesaana: convoca a la Antecámara en Tel'aran'rhiod con Sabias y Detectoras de Vientos. Por casualidad, el clavo de sueño que Perrin se ha llevado hasta allí impide que nadie escape. Llega el Ajah Negro, y Mesaana intenta ponerle un a'dam a Egwene, pero Egwene domina el sueño mejor que ella y <b>le destroza la mente</b>. Nicola muere. Gawyn, gravemente herido, mata a tres asesinos. Egwene lo vincula y aceptan casarse. Propone un intercambio de aprendizas entre Aes Sedai, Sabias y Detectoras de Vientos.</p>

<h3>Elayne</h3>
<p>Elayne se pone copias del medallón y se hace pasar por una Renegada para interrogar a las Negras presas. <b>Mellar</b> la apuñala y se escapa con una copia; ella recupera el original. Morgase vuelve a Caemlyn y se reencuentra con Elayne y Galad. Se acuerda que Perrin gobierne Dos Ríos como señor dentro de Andor. Elayne despoja a nobles rebeldes y entrega tierras a cairhieninos para ganarse Cairhien, y se sienta en el <b>Trono del Sol</b>. Los ejércitos de Andor y Cairhien marchan a Merrilor.</p>

<h3>Lan y Nynaeve</h3>
<p>Nynaeve pasa la prueba de Aes Sedai: hace cien tejidos sin perder la calma mientras deja atrás a heridos, y rompe reglas usando fuego compacto. Después obliga a Myrelle a <b>pasarle el vínculo de Lan</b>. Lan llega al Paso de Tarwin con unos doce mil jinetes.</p>

<h3>Aviendha y la Torre Negra</h3>
<p>Aviendha cruza el Yermo hacia Rhuidean. Una mujer misteriosa, <b>Nakomi</b>, le pregunta qué será de los aiel tras la Última Batalla. En las columnas de cristal ve un futuro terrible: sus descendientes caen, los seanchan conquistan las tierras húmedas y los aiel desaparecen.</p>
<p>En la <b>Torre Negra</b>, Taim gobierna con mano de hierro, Logain no aparece y nadie puede abrir accesos para salir. Algunos compañeros cambian por dentro, como si fueran otros. El Dedicado <b>Androl</b> y varios hombres de Dos Ríos se dan cuenta de que algo va muy mal y se alían con la Roja <b>Pevara</b>.</p>

<h3>Epílogo</h3>
<p>Shaidar Haran castiga a Graendal por sus fracasos. Olver abre la carta de Verin: avisa de que los trollocs entrarán en <b>Caemlyn por la Puerta de los Atajos</b>, y Caemlyn ya arde. Lan, con doce mil hombres, se enfrenta en el Paso de Tarwin a ciento cincuenta mil engendros.</p>
<p class="nota">Dato del glosario de este libro: quien mató a Asmodean fue Graendal.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Androl Genhald</b>, <b>Emarin</b>, <b>Jonneth</b>, <b>Canler</b>: Asha'man leales de la Torre Negra.</li>
<li><b>Nakomi</b>: aiel misteriosa. <b>Almen Bunt</b>: granjero.</li>
<li><b>Jain Farstrider</b>: era Noal.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Mesaana</b>: queda con la mente destruida. <b>Gholam</b>: destruido. <b>Saltador</b>: muerto por Matador.</li>
<li><b>Graendal</b>: viva; maneja a Matador y el clavo de sueño. <b>Moridin</b> la vigila.</li>
<li><b>Taim</b>: algo terrible está pasando en la Torre Negra.</li>
<li><b>Hordas de la Llaga</b> invaden Saldaea, Kandor y Arafel. <b>Fain</b> anda por la Llaga.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Asedio de Maradon</b>: Ituralde y Bashere, con Rand, contra la Sombra.</li>
<li><b>Capas Blancas contra Perrin</b>, que acaban unidos tras la emboscada trolloc.</li>
<li><b>Malkieri y fronterizos</b> hacia el Paso de Tarwin.</li>
<li><b>Ejércitos convocados a Merrilor</b>: Torre Blanca, Andor, Cairhien, Perrin, Capas Blancas, fronterizos y otros.</li>
<li><b>Caemlyn</b>: invadida por los Atajos.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: romper los sellos y encerrar de nuevo al Oscuro. Antes quiere un tratado.</li>
<li><b>Egwene</b>: unir a todas las naciones para obligar a Rand a negociar.</li>
<li><b>Elayne</b>: unir Andor y Cairhien y armarse con los dragones.</li>
<li><b>Perrin</b>: aceptar el mando y hacer de su gente un ejército.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand, Egwene, Perrin, Elayne, Galad</b>: en el Campo de Merrilor o llegando.</li>
<li><b>Mat, Thom y Moraine</b>: saliendo de la Torre de Ghenjei. Mat tiene un parche en el ojo.</li>
<li><b>Lan</b>: en el Paso de Tarwin. <b>Aviendha</b>: en Rhuidean.</li>
<li><b>Logain</b>: preso en la Torre Negra. <b>Tuon</b>: en Ebou Dar.</li>
</ul>
`};

BOOKS[14]={n:14,t:"Un recuerdo de luz",en:"A Memory of Light",y:2013,era:"Año 1000 NE: Tarmon Gai'don",html:`
<p class="lead">La Última Batalla. Un libro casi entero de guerra en cuatro frentes que acaban en dos sitios: el Campo de Merrilor y Shayol Ghul.</p>

<h2>Prólogo</h2>
<p>Los trollocs salen en masa por la Puerta de los Atajos de <b>Caemlyn</b> y la ciudad arde. Talmanes, herido por una hoja envenenada de Thakan'dar, y la Compañía de la Mano Roja se juegan la vida para sacar de allí los <b>dragones</b> de Aludra. Isam recibe la orden de matar a Rand.</p>

<h2>La trama</h2>
<h3>El Campo de Merrilor</h3>
<p>Las naciones se reúnen en Merrilor. Rand propone <b>la Paz del Dragón</b>: romperá los sellos solo si los gobernantes firman un tratado que les prohíbe guerrear entre sí. Egwene se opone hasta que <b>Moraine</b> se presenta y, con las Profecías en la mano, convence a todos. Aviendha exige que los aiel entren en el tratado como guardianes de la paz. <b>Elayne</b> queda como comandante suprema de los ejércitos de la Luz. Egwene guarda los sellos para romperlos cuando Rand dé la señal.</p>

<h3>La Torre Negra</h3>
<p><b>Androl</b> y <b>Pevara</b> se vinculan el uno al otro y descubren que pueden comunicarse sin hablar. Taim convierte por la fuerza a Asha'man a la Sombra usando trece Myrddraal y trece Señores del Espanto. Con ayuda de los muchachos de Dos Ríos rescatan a <b>Logain</b>, al que estaban intentando convertir. Taim, ahora el <b>M'Hael</b>, se va con los suyos a la Sombra.</p>

<h3>Los cuatro frentes</h3>
<ul>
<li><b>Andor</b>: Elayne y Bashere incendian Caemlyn para sacar a los trollocs y los machacan en el bosque de Braem con los dragones. Perrin les ayuda y los ogier de Loial se suman a la guerra.</li>
<li><b>Kandor</b>: Egwene, las Aes Sedai y Bryne. Con un <i>sa'angreal</i> de la Torre, Egwene destroza a los trollocs. Entonces un acceso enorme vomita un ejército de <b>Shara</b> con cientos de encauzadores.</li>
<li><b>Shienar</b>: Lan y los fronterizos, con Agelmar, aguantan el Paso de Tarwin y luego retroceden.</li>
<li><b>Thakan'dar</b>, el valle de Shayol Ghul: Rand entra con los aiel, Ituralde, los tairenses de Darlin y los Juramentados del Dragón.</li>
</ul>
<p>Todo empieza a torcerse: los <b>cuatro grandes capitanes</b>, Bryne, Bashere, Ituralde y Agelmar, toman decisiones que llevan a la derrota. Graendal, ahora <b>Hessalam</b>, los ha sometido a una Compulsión sutil. Perrin la ve salir de la tienda de Bryne y Mat ata cabos.</p>

<h3>Mat y los seanchan</h3>
<p>Mat entra en Ebou Dar disfrazado, salva a Tuon de un Hombre Gris y consigue que los seanchan luchen. <b>Tuon firma la Paz del Dragón</b>. Min se convierte en la Portavoz de la Verdad de Fortuona. Egwene entrega a Mat el mando de todas las fuerzas. Su medallón lo protege de la Compulsión. Mat finge una pelea con Tuon y los seanchan se retiran, como parte de un plan que mantiene en secreto.</p>

<h3>La Última Batalla en Merrilor</h3>
<p>Mat elige el Campo de Merrilor y sus alturas de Polov para la batalla final. <b>Demandred</b> se revela al frente de los sharaníes, con el nombre de Bao el Wyld y un <i>sa'angreal</i> enorme, y reta a Rand a gritos. <b>Gawyn</b> se pone los anillos de los Cuchillos de Sangre, ataca a Demandred y <b>muere</b>. <b>Galad</b> se bate con él y pierde un brazo. <b>Siuan</b> muere en un ataque contra el puesto de mando y <b>Bryne</b>, sin el vínculo, se lanza a la muerte.</p>
<p><b>Egwene</b> se enfrenta a Taim. El fuego compacto está agrietando el Entramado, y Egwene crea su contrario: <b>la Llama de Tar Valon</b>. Con ella sella las grietas y mata a Taim, pero se consume ella misma. <b>Egwene muere.</b></p>
<p><b>Lan</b> se deja atravesar para poder alcanzar a Demandred y <b>lo mata</b>. Olver toca el <b>Cuerno de Valere</b>; el vínculo de Mat con el Cuerno se rompió cuando murió en Caemlyn. Faile lo había escondido entre los suministros, perdió la caravana en la Llaga y se lo hizo llegar al chico. Llegan los <b>Héroes</b>, entre ellos Birgitte: Mellar la había decapitado al capturar a Elayne, y ahora vuelve como Héroe, mata a Mellar y rescata a Elayne. Los muertos de Hinderstap luchan del lado de la Luz. Los seanchan vuelven en el momento justo y los ogier cantan. Se rompe la presa que retenía el río Mora y la riada parte la hueste trolloc. <b>La Luz gana el campo.</b></p>
<p>Aviendha tiene que matar a <b>Rhuarc</b>, sometido por la Compulsión. Se enfrenta a Graendal, que acaba víctima de su propia Compulsión y queda <b>esclava de Aviendha</b>. <b>Moghedien</b>, disfrazada con la Máscara de Espejos, cae en manos de una sul'dam. Androl y Pevara atraen a los Señores del Espanto a un <i>stedding</i>. Logain busca el <i>sa'angreal</i> de Demandred, el Sakarnen, pero al final elige salvar a los refugiados.</p>

<h3>Perrin en el sueño</h3>
<p>Perrin protege a Rand en el sueño del lobo, donde entra en carne y hueso. Lucha una y otra vez contra Matador hasta que <b>lo mata</b>. Lanfear, que se hace llamar Cyndane y finge querer redimirse, intenta someterlo; él se resiste por amor a Faile y <b>le rompe el cuello</b>. Salva a Gaul.</p>

<h3>Rand contra el Oscuro</h3>
<p>Rand entra en la cueva de Shayol Ghul con Callandor, formando círculo con <b>Moraine y Nynaeve</b>; fuera, Thom guarda la entrada. Fuera del tiempo, el Oscuro le muestra mundos posibles. Rand entiende que no puede matarlo ni borrarlo: sin la posibilidad del mal, la gente no sería libre. <b>Mat mata a Padan Fain</b>, y Moridin mata a Alanna, que tenía el vínculo de Rand.</p>
<p>Moridin se apodera de Callandor. Moraine y Nynaeve usan su defecto para <b>tomar el control de Moridin</b> a través del círculo y canalizan el Poder Verdadero. Logain rompe los sellos y Rand teje juntos <i>saidin</i>, <i>saidar</i> y el Poder Verdadero, y <b>vuelve a sellar al Oscuro</b>, esta vez sin mácula.</p>
<p>Rand parece morir y queman su cuerpo en una pira. En realidad sus almas se han intercambiado: Rand despierta en el cuerpo de Moridin. Solo Min, Elayne, Aviendha y algunos lo saben. Sin espada ni Poder, pero capaz de encender su pipa con el pensamiento, se marcha a caballo hacia lo desconocido.</p>

<h3>Después</h3>
<p>La Llaga empieza a desaparecer. <b>Cadsuane</b> es la nueva Amyrlin. En la guerra han muerto la reina Tenobia y los padres de Faile, así que Faile y Perrin heredan Saldaea. Mat vuelve con Tuon. Lan y Nynaeve sobreviven, igual que Thom y Moraine.</p>

<h2>Muertes principales</h2>
<ul>
<li><b>De la Luz</b>: Egwene, Gawyn, Siuan, Gareth Bryne, Rhuarc, Davram Bashere y Tenobia, entre muchos otros.</li>
<li><b>De la Sombra</b>: Demandred (Lan), Taim (Egwene), Matador y Lanfear (Perrin), Padan Fain (Mat), Moridin (en el cuerpo de Rand).</li>
<li><b>Capturadas</b>: Graendal (por Aviendha) y Moghedien (por los seanchan).</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Caemlyn</b>: tomada por los trollocs e incendiada por Elayne.</li>
<li><b>Frentes</b>: Andor y el bosque de Braem, Kandor, el Paso de Tarwin y Thakan'dar. Todos acaban replegándose a Merrilor.</li>
<li><b>Sharaníes de Demandred</b>: entran por accesos en Kandor y en Merrilor.</li>
<li><b>Batalla del Campo de Merrilor</b>: todas las naciones, seanchan incluidos, contra trollocs, sharaníes y Señores del Espanto.</li>
<li><b>Thakan'dar</b>: aiel, Ituralde y tairenses defienden el valle mientras Rand lucha dentro.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>La Paz del Dragón</b>: tratado entre las naciones, seanchan incluidos.</li>
<li><b>Graendal</b>: corromper a los generales en vez de pelear contra ellos.</li>
<li><b>Mat</b>: esconder sus planes incluso a sus aliados y elegir el campo de batalla.</li>
<li><b>Rand</b>: no destruir al Oscuro, sino encerrarlo bien.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: vivo en otro cuerpo, libre y anónimo.</li>
<li><b>Mat</b>: Príncipe de los Cuervos, junto a Fortuona.</li>
<li><b>Perrin y Faile</b>: señores de Dos Ríos, herederos de Saldaea.</li>
<li><b>Elayne</b>: reina de Andor y Cairhien, embarazada de gemelos.</li>
<li><b>Nynaeve y Lan</b>, <b>Thom y Moraine</b>: vivos.</li>
<li><b>Aviendha</b>: Sabia. <b>Min</b>: sabe que Rand vive.</li>
<li><b>Cadsuane</b>: Amyrlin. <b>Logain</b>: con los Asha'man supervivientes.</li>
</ul>

<script>(function(){

/* ---------- Ornamentos ---------- */
const ORN=`<svg class="orn" viewBox="0 0 220 28" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
<path d="M4 14 H84"/><path d="M136 14 H216"/><path d="M84 14 c8-10 18-10 26 0 c8 10 18 10 26 0"/><path d="M84 14 c8 10 18 10 26 0 c8-10 18-10 26 0" opacity=".55"/>
<circle cx="110" cy="14" r="3.2" fill="currentColor"/><path d="M60 14 l-6-4 M60 14 l-6 4 M160 14 l6-4 M160 14 l6 4"/></g></svg>`;
function wheel(cls){let s=`<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor">`;
 s+=`<circle cx="50" cy="50" r="44" stroke-width="3"/><circle cx="50" cy="50" r="38" stroke-width="1"/><circle cx="50" cy="50" r="9" stroke-width="3"/>`;
 for(let i=0;i<8;i++){const a=i*Math.PI/4,c=Math.cos(a),sn=Math.sin(a);s+=`<path d="M${50+c*9} ${50+sn*9} L${50+c*38} ${50+sn*38}" stroke-width="3"/>`}
 for(let i=0;i<16;i++){const a=i*Math.PI/8+Math.PI/16;s+=`<circle cx="${50+Math.cos(a)*41}" cy="${50+Math.sin(a)*41}" r="1.2" fill="currentColor" stroke="none"/>`}
 return s+`</g></svg>`}
function seal(cls){let pts=[];const n=26;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,r=44+((i*37)%7)-3+(i%2?2.5:0);pts.push((50+Math.cos(a)*r).toFixed(1)+","+(50+Math.sin(a)*r).toFixed(1))}
 let sp="";for(let i=0;i<8;i++){const a=i*Math.PI/4;sp+=`<path d="M${50+Math.cos(a)*6} ${50+Math.sin(a)*6} L${50+Math.cos(a)*22} ${50+Math.sin(a)*22}"/>`}
 return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="wx" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#d4473a"/><stop offset=".55" stop-color="#9a1d17"/><stop offset="1" stop-color="#5c0e0a"/></radialGradient></defs>
 <polygon points="${pts.join(" ")}" fill="url(#wx)"/><circle cx="50" cy="50" r="31" fill="none" stroke="#5c0e0a" stroke-width="2.5" opacity=".7"/>
 <circle cx="50" cy="50" r="29" fill="none" stroke="#e8786a" stroke-width="1" opacity=".45"/>
 <g stroke="#5a0d09" stroke-width="3" fill="none" opacity=".85"><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="6"/>${sp}</g>
 <g stroke="#e98b7c" stroke-width="1" fill="none" opacity=".35" transform="translate(-.8,-.8)"><circle cx="50" cy="50" r="22"/></g></svg>`}

/* ---------- Estado ---------- */
const S={readUpTo:store.get("readUpTo",9),unsealed:new Set(store.get("unsealed",[])),pages:[],leaves:[],cur:0,L:0,mode:"spread",pw:400,ph:580,
  titleIdx:{},mapBook:1,busy:false,pendingOpen:true};
const isSealed=n=>n>S.readUpTo&&!S.unsealed.has(n);

window.CRW={isSealed,ROMAN,seal,go:n=>goBook(n),unseal:n=>unseal(n)};

/* ---------- Grano del pergamino ---------- */
(function(){try{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d");const d=x.createImageData(160,160);
 for(let i=0;i<d.data.length;i+=4){const v=200+Math.random()*55|0;d.data[i]=v;d.data[i+1]=v*.97|0;d.data[i+2]=v*.9|0;d.data[i+3]=Math.random()<.5?18:0}
 x.putImageData(d,0,0);document.documentElement.style.setProperty("--grain",`url(${c.toDataURL()})`)}catch(e){}
 try{const w=300,h=440,c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");const d=x.createImageData(w,h);
  const pal=[[92,26,20],[38,52,78],[176,138,62],[122,40,30],[28,38,56],[214,186,120],[70,20,16]];
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
   const u=i+18*Math.sin(j*.045)+9*Math.sin(j*.11+i*.02)+5*Math.sin(i*.07+j*.013);
   const v=j+14*Math.sin(u*.05)+6*Math.sin(u*.13);
   const band=((u*.06+v*.018+Math.sin(v*.06)*1.4)%pal.length+pal.length)%pal.length;const k=band|0,f=band-k;const a=pal[k],b2=pal[(k+1)%pal.length];
   const ff=f<.75?0:(f-.75)/.25;const o=(j*w+i)*4;
   d.data[o]=a[0]+(b2[0]-a[0])*ff;d.data[o+1]=a[1]+(b2[1]-a[1])*ff;d.data[o+2]=a[2]+(b2[2]-a[2])*ff;d.data[o+3]=255}
  x.putImageData(d,0,0);document.documentElement.style.setProperty("--marble",`url(${c.toDataURL()})`)}catch(e){}
})();

/* ---------- Medidas ---------- */
const stage=$("#bookstage"),wrap=$("#bookwrap"),bookEl=$("#book"),measure=$("#measure");
function computeSize(){
  const app=matchMedia("(max-width:760px)").matches;
  S.mode=app?"single":"spread";
  const st=stage.getBoundingClientRect();
  const ratio=.70;
  let pw,ph;
  if(app){const mh=$(".main").clientHeight||(window.innerHeight-130);const bb=($(".bookbar").offsetHeight||46)+10;
    const availW=Math.max(240,window.innerWidth-34),availH=Math.max(280,mh-18-bb-6);
    pw=Math.min(availW,560);ph=Math.min(availH,pw/.56)}
  else{const availW=Math.max(260,(window.innerWidth<=1100?window.innerWidth-36:st.width)-28);
    const availH=window.innerWidth<=1100?Math.min(window.innerHeight*.8,860):Math.max(420,st.height-86);
    pw=Math.min(availW/2,availH*ratio,520);ph=pw/ratio}
  S.pw=Math.floor(pw);S.ph=Math.floor(ph);
  const fs=Math.max(13.6,Math.min(17.4,S.pw/25.5));
  const r=document.documentElement.style;
  r.setProperty("--fs",fs.toFixed(2)+"px");
  const pt=Math.round(S.ph*.085),pb=Math.round(S.ph*.08),pl=Math.round(S.pw*.105),pr=Math.round(S.pw*.085);
  for(const [k,v] of [["--pt",pt],["--pb",pb],["--pl",(S.mode==="single"?pr:pl)],["--pr",pr]]) r.setProperty(k,v+"px");
  measure.style.width=S.pw+"px";measure.style.height=S.ph+"px";
}

/* ---------- Paginación ---------- */
function newMeasurePage(){measure.innerHTML=`<div class="page"><div class="pc"></div></div>`;return measure.querySelector(".pc")}
const over=pc=>pc.scrollHeight>pc.clientHeight+1;
function cutPoints(el){const pts=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){const t=n.nodeValue;for(let i=1;i<t.length;i++){if(t[i]===" "&&t[i-1]!==" ")pts.push([n,i])}}return pts}
function splitEl(el,box,pc){ // parte el elemento por palabras: [lo que cabe, el resto]
  const pts=cutPoints(el);if(!pts.length)return [null,el];
  let lo=0,hi=pts.length-1,best=-1;
  const make=(k,first)=>{const r=document.createRange();if(first){r.setStart(el,0);r.setEnd(pts[k][0],pts[k][1])}else{r.setStart(pts[k][0],pts[k][1]+1);r.setEnd(el,el.childNodes.length)}
    const c=el.cloneNode(false);c.appendChild(r.cloneContents());return c};
  while(lo<=hi){const mid=(lo+hi)>>1;const c=make(mid,true);box.appendChild(c);const ok=!over(pc);box.removeChild(c);if(ok){best=mid;lo=mid+1}else hi=mid-1}
  if(best<0)return [null,el];
  const a=make(best,true),b=make(best,false);b.classList.add("cont");b.classList.remove("lead");
  return [a,b];
}
function paginateHTML(html){
  const src=document.createElement("div");src.innerHTML=html;
  const pages=[];let pc=newMeasurePage();
  const flush=()=>{let carry=[];while(pc.lastElementChild&&/^H[23]$/.test(pc.lastElementChild.tagName)&&pc.childElementCount>1){carry.unshift(pc.lastElementChild);pc.removeChild(pc.lastElementChild)}
    if(pc.childElementCount)pages.push(pc.innerHTML);pc=newMeasurePage();carry.forEach(c=>pc.appendChild(c))};
  const queue=[...src.children];let guard=0;
  while(queue.length&&guard++<5000){
    const b=queue.shift();
    if(b.tagName==="UL"){
      const items=[...b.children];const ul=b.cloneNode(false);pc.appendChild(ul);let broke=false;
      for(let i=0;i<items.length;i++){
        ul.appendChild(items[i]);
        if(!over(pc))continue;
        ul.removeChild(items[i]);
        const [a,rest]=splitEl(items[i],ul,pc);
        const remaining=items.slice(i+1);
        if(a&&a.textContent.length>40){ul.appendChild(a);remaining.unshift(rest)}
        else if(!ul.childElementCount&&pc.childElementCount===1){ul.appendChild(items[i]);flush();if(remaining.length){const nu=b.cloneNode(false);nu.classList.add("cont");remaining.forEach(x=>nu.appendChild(x));queue.unshift(nu)}broke=true;break}
        else remaining.unshift(items[i]);
        if(!ul.childElementCount)pc.removeChild(ul);
        const nu=b.cloneNode(false);nu.classList.add("cont");remaining.forEach(x=>nu.appendChild(x));
        flush();queue.unshift(nu);broke=true;break}
      continue}
    pc.appendChild(b);
    if(!over(pc))continue;
    pc.removeChild(b);
    if(b.tagName==="P"){
      const [a,rest]=splitEl(b,pc,pc);
      if(a&&(a.textContent.length>60||!pc.childElementCount)){pc.appendChild(a);flush();queue.unshift(rest);continue}
      if(!pc.childElementCount){pc.appendChild(b);flush();continue}
      flush();queue.unshift(b);continue}
    if(!pc.childElementCount){pc.appendChild(b);flush();continue}
    flush();queue.unshift(b);
  }
  if(pc.childElementCount)pages.push(pc.innerHTML);
  return pages;
}
/* ---------- Construcción de páginas ---------- */
function titleHTML(n){const B=BOOKS[n];
  let h=`<div class="ctr">${ORN}<div class="tp-num">Libro ${ROMAN[n]}</div><div class="tp-title">${B.t}</div>
  <div class="tp-orig"><i>${B.en}</i> · ${B.y}</div><div class="tp-era">${B.era}</div>${ORN}`;
  if(isSealed(n)){h+=`${seal("seal")}<p class="sealtxt">Este libro está lacrado: aún no lo has leído.</p>
   <button class="btn-seal" data-ask="${n}">Romper el sello</button>
   <div class="confirm" data-confirm="${n}" hidden><p class="sealtxt">Se mostrará el libro entero, con su final.</p>
   <div class="row"><button class="btn-seal" data-unseal="${n}">Sí, romperlo</button><button class="btn-ghost" data-cancel="${n}">Mejor no</button></div></div>`}
  else h+=`<p class="tp-hint">Pasa la página para leer. El mapa sigue los movimientos de este libro.</p>`;
  return h+`</div>`}
function build(){
