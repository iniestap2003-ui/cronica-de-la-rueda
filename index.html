<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crónica de la Rueda</title>
<meta name="description" content="Los catorce libros de La Rueda del Tiempo resumidos en un libro 3D, con un mapa en relieve de personajes y ejércitos.">
<meta name="theme-color" content="#140d08"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Crónica"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>@font-face{font-family:'Cinzel';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/cinzel-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cinzel-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/cinzel-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/eb-garamond-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/eb-garamond-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/eb-garamond-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/eb-garamond-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:600;font-display:swap;src:url(fonts/eb-garamond-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Uncial Antiqua';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/uncial-antiqua-latin-400-normal.woff2) format('woff2')}</style>
<style>/* Concepto: un escritorio a la luz de una vela. A la izquierda, un libro encuadernado en cuero; a la derecha, un mapa en relieve sobre la mesa. */
:root{
  --table:#140d08; --table2:#24170e; --ink:#1e140b;
  --leather:#5b2217; --leather2:#33130d; --leather3:#7a3020;
  --parch:#f1e4c6; --parch2:#e6d3a8; --parch3:#cdb383; --edge:#b89a69;
  --text:#2a1c0f; --text2:#5e4a33; --rubric:#8e2219;
  --gold:#c9a44c; --gold2:#e8cd82; --gold3:#8d6d2c;
  --wax:#8f1c17; --wax2:#c0372c;
  --ui:#eadcbd; --ui2:#b7a07a; --ui3:#7d6a4f; --line:rgba(234,220,189,.16); --panel:rgba(26,17,10,.78);
  --display:"Cinzel","Trajan Pro","Book Antiqua",Georgia,serif;
  --body:"EB Garamond","Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --initial:"Uncial Antiqua","Cinzel",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column}
body{margin:0;color:var(--ui);font-family:var(--body);font-size:16px;line-height:1.45;
  background:
    radial-gradient(ellipse 60% 50% at 28% 22%,rgba(255,186,104,.13),transparent 70%),
    radial-gradient(ellipse 50% 60% at 78% 70%,rgba(255,160,80,.06),transparent 70%),
    repeating-linear-gradient(91deg,rgba(0,0,0,.09) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(89deg,rgba(255,220,170,.025) 0 1px,transparent 1px 23px),
    linear-gradient(180deg,#22160d,#130c07 70%);
  background-color:var(--table);
  overflow-x:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* ---------- Cabecera ---------- */
.top{display:flex;align-items:center;gap:18px;padding:12px 18px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.14em;color:var(--gold2);text-wrap:balance;
  text-shadow:0 1px 0 #000,0 0 18px rgba(232,205,130,.18)}
.brand span{font-style:italic;color:var(--ui2);font-size:14px}
.ribbon{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center;min-width:0}
.rb{position:relative;font-family:var(--display);font-size:12.5px;letter-spacing:.06em;min-width:34px;height:30px;padding:0 7px;border-radius:2px;cursor:pointer;
  color:var(--ui);background:linear-gradient(180deg,#3a2414,#26170d);border:1px solid rgba(201,164,76,.35);box-shadow:inset 0 1px 0 rgba(255,230,180,.08)}
.rb:hover{border-color:var(--gold);color:var(--gold2)}
.rb[aria-current="true"]{background:linear-gradient(180deg,#7a2a1d,#4d1810);border-color:var(--gold);color:#fff3d6}
.rb.sealed::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--wax2),var(--wax) 60%,#5a0f0b);box-shadow:0 1px 2px #000}
.readsel{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ui2)}
.readsel select{font-family:var(--body);font-size:15px;background:#26170d;color:var(--ui);border:1px solid rgba(201,164,76,.4);border-radius:2px;padding:3px 6px}

/* ---------- Disposición ---------- */
.main{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:16px;padding:12px 18px 18px;flex:1 1 0;min-height:600px}
.bookstage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.mapstage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px}
@media (max-width:1100px){
  body{height:auto;display:block}
  .main{display:flex;flex-direction:column;height:auto;min-height:0}
  .bookstage{min-height:auto;padding-top:6px}
  .mapstage{height:auto}
  .top{justify-content:center;text-align:center}
  .brand{align-items:center}
}

/* ---------- Libro ---------- */
.bookwrap{position:relative;perspective:2600px;perspective-origin:50% 40%;flex:none}
.book{position:relative;transition:transform .9s cubic-bezier(.45,.05,.25,1)}
.book .board{position:absolute;top:-9px;bottom:-11px;width:calc(50% + 10px);border-radius:4px;
  background:
   radial-gradient(ellipse at 30% 30%,rgba(255,200,150,.08),transparent 60%),
   repeating-linear-gradient(35deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),
   linear-gradient(135deg,var(--leather3),var(--leather) 45%,var(--leather2));
  box-shadow:0 18px 40px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.5),inset 0 0 0 2px rgba(201,164,76,.18);transition:opacity .4s}
.book .board.l{left:-10px}.book .board.r{right:-10px}
.book .stack{position:absolute;top:2px;bottom:2px;pointer-events:none;
  background:repeating-linear-gradient(90deg,#efe1bf 0 1px,#cdb385 1px 2px);box-shadow:0 0 3px rgba(0,0,0,.4)}
.book .stack.l{right:100%}.book .stack.r{left:100%}
.leaf{position:absolute;top:0;height:100%;transform-origin:0 50%;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.42,.08,.22,1)}
.leaf.instant{transition:none}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s}
.leaf.turning .face.front::after{background:linear-gradient(90deg,rgba(40,25,10,.0),rgba(40,25,10,.38));opacity:1}
.leaf.turning .face.back::after{background:linear-gradient(270deg,rgba(40,25,10,.0),rgba(40,25,10,.38));opacity:1}
.leaf.turning .face{box-shadow:0 8px 22px rgba(0,0,0,.28)}

/* Página */
.page{position:absolute;inset:0;color:var(--text);font-size:var(--fs,15.5px);line-height:1.42;
  background:
   radial-gradient(ellipse at 50% 45%,rgba(255,250,235,.55),transparent 75%),
   radial-gradient(circle at 15% 85%,rgba(160,120,60,.10),transparent 30%),
   radial-gradient(circle at 88% 12%,rgba(160,120,60,.08),transparent 25%),
   linear-gradient(var(--parch),var(--parch2));
  hyphens:auto;-webkit-hyphens:auto}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.5;mix-blend-mode:multiply}
.face.front .page{box-shadow:inset 22px 0 26px -18px rgba(70,45,15,.45),inset -1px 0 0 rgba(0,0,0,.08)}
.face.back .page{box-shadow:inset -22px 0 26px -18px rgba(70,45,15,.45),inset 1px 0 0 rgba(0,0,0,.08)}
.single .face.front .page{box-shadow:inset 10px 0 16px -12px rgba(70,45,15,.35)}
.pc{position:absolute;top:var(--pt);bottom:var(--pb);left:var(--pl);right:var(--pr);overflow:hidden}
.face.back .pc{left:var(--pr);right:var(--pl)}
.rh{position:absolute;top:calc(var(--pt) * .42);left:var(--pl);right:var(--pr);text-align:center;font-family:var(--display);font-size:.62em;letter-spacing:.2em;color:var(--text2);text-transform:uppercase}
.face.back .rh{left:var(--pr);right:var(--pl)}
.folio{position:absolute;bottom:calc(var(--pb) * .4);left:0;right:0;text-align:center;font-size:.8em;color:var(--text2);font-variant-numeric:oldstyle-nums}
.pc p{margin:0 0 .5em;text-align:justify;text-indent:1.2em}
.pc p.lead{text-indent:0;font-size:1.04em}
.pc p.lead::first-letter{font-family:var(--initial);float:left;font-size:3.35em;line-height:.86;padding:.06em .1em 0 0;color:var(--rubric);text-shadow:1px 1px 0 rgba(201,164,76,.55)}
.pc p.cont,.pc ul.cont li.cont{text-indent:0}
.pc h2{font-family:var(--display);font-weight:600;font-size:.98em;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);text-align:center;margin:.85em 0 .5em;text-wrap:balance}
.pc h2::before,.pc h2::after{content:"—";color:var(--gold3);margin:0 .5em;font-weight:400}
.pc h3{font-family:var(--body);font-style:italic;font-weight:600;font-size:1.05em;color:#5a2a12;margin:.6em 0 .25em;text-wrap:balance}
.pc > :first-child{margin-top:0}
.pc ul{margin:0 0 .5em;padding-left:1.1em}
.pc li{margin:0 0 .28em;text-align:left}
.pc li::marker{color:var(--rubric)}
.pc b{font-weight:600;color:#1f1308}
.pc i{font-style:italic}
.pc p.nota{text-indent:0;font-style:italic;font-size:.92em;color:var(--text2);border-top:1px solid rgba(94,74,51,.3);padding-top:.4em;margin-top:.7em}

/* Páginas especiales */
.ctr{position:absolute;inset:var(--pt) var(--pl) var(--pb);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.55em}
.face.back .ctr{left:var(--pr);right:var(--pl)}
.orn{width:58%;max-width:220px;height:auto;color:var(--gold3)}
.tp-num{font-family:var(--display);letter-spacing:.32em;font-size:.86em;color:var(--text2);text-transform:uppercase}
.tp-title{font-family:var(--display);font-weight:600;font-size:2.05em;line-height:1.1;margin:.1em 0;color:var(--rubric);text-wrap:balance;letter-spacing:.03em}
.tp-orig{font-style:italic;color:var(--text2)}
.tp-era{font-size:.9em;color:var(--text2);font-variant:small-caps;letter-spacing:.04em}
.tp-hint{font-style:italic;color:var(--text2);font-size:.9em;max-width:22em}
.seal{width:6.2em;height:6.2em;filter:drop-shadow(0 3px 3px rgba(60,10,5,.45))}
.btn-seal{font-family:var(--display);font-size:.78em;letter-spacing:.12em;text-transform:uppercase;padding:.55em 1.1em;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#a32a22,#6e140f);color:#fbe8c8;border:1px solid #4a0c08;box-shadow:0 2px 0 #3c0a07}
.btn-seal:hover{filter:brightness(1.12)}
.btn-ghost{font-family:var(--body);font-size:.9em;padding:.45em .9em;border-radius:2px;cursor:pointer;background:transparent;color:var(--text2);border:1px solid rgba(94,74,51,.45)}
.sealtxt{font-style:italic;color:var(--text2);max-width:20em;margin:0}
.confirm{display:flex;flex-direction:column;align-items:center;gap:.5em}
.confirm[hidden]{display:none}
.confirm .row{display:flex;gap:.6em}

.toc h2{font-family:var(--display);color:var(--rubric);letter-spacing:.2em;text-align:center;font-weight:600;font-size:1.25em;margin:0 0 .8em}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{display:flex;align-items:baseline;gap:.4em;padding:.08em 0;cursor:pointer;border-radius:2px}
.toc li:hover{background:rgba(201,164,76,.18)}
.toc .rn{font-family:var(--display);color:var(--rubric);min-width:2.3em;font-size:.86em}
.toc .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc .dots{flex:1;border-bottom:1px dotted rgba(94,74,51,.6);transform:translateY(-.25em);min-width:1em}
.toc .pg{font-variant-numeric:oldstyle-nums tabular-nums;color:var(--text2)}
.toc .sx{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--wax2),var(--wax) 60%,#5a0f0b);margin-left:.25em;transform:translateY(.05em)}
.note h2{font-family:var(--display);color:var(--rubric);letter-spacing:.18em;text-align:center;font-weight:600;font-size:1.05em;margin:0 0 .6em}
.note p{text-indent:0;text-align:left;margin:0 0 .5em}
.note .pc,.toc .pc{font-size:.94em}
.legendpg .sw{display:inline-block;width:1.9em;height:1.1em;vertical-align:-.15em;margin-right:.45em;border:1px solid rgba(0,0,0,.35)}
.legendpg ul{list-style:none;padding:0;margin:0 0 .5em}
.legendpg li{margin:.18em 0}

/* Tapa */
.cover{position:absolute;inset:0;border-radius:2px 5px 5px 2px;
  background:
   radial-gradient(ellipse at 30% 25%,rgba(255,210,160,.12),transparent 55%),
   radial-gradient(ellipse at 70% 85%,rgba(0,0,0,.35),transparent 60%),
   repeating-linear-gradient(40deg,rgba(0,0,0,.05) 0 2px,transparent 2px 6px),
   linear-gradient(135deg,var(--leather3),var(--leather) 50%,var(--leather2));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 12px 0 18px -10px rgba(0,0,0,.6)}
.cover::before{content:"";position:absolute;inset:6%;border:2px solid rgba(201,164,76,.75);box-shadow:inset 0 0 0 5px rgba(0,0,0,0),inset 0 0 0 6px rgba(201,164,76,.45)}
.cover .ctr{inset:12% 12%}
.cv-title{font-family:var(--display);font-weight:700;font-size:2.15em;letter-spacing:.12em;line-height:1.12;text-align:center;
  background:linear-gradient(180deg,#f6e3a6,#c9a44c 55%,#8d6d2c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.7))}
.cv-sub{font-family:var(--body);font-style:italic;color:#e9d39a;font-size:1.05em;opacity:.9}
.cv-emb{width:44%;max-width:150px;color:#d9b660;filter:drop-shadow(0 1px 0 rgba(0,0,0,.7))}
.cv-hint{font-family:var(--display);font-size:.7em;letter-spacing:.25em;color:#e9d39a;opacity:.75;text-transform:uppercase}
.endpaper{position:absolute;inset:0;background:var(--marble,#5a2a20);background-size:cover;filter:saturate(.7) brightness(.82) contrast(.95)}
.endpaper::after{content:"";position:absolute;inset:0;box-shadow:inset -18px 0 22px -14px rgba(0,0,0,.6)}

/* Controles del libro */
.bookbar{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.nav{width:40px;height:40px;border-radius:50%;cursor:pointer;border:1px solid rgba(201,164,76,.45);color:var(--gold2);font-size:18px;
  background:radial-gradient(circle at 35% 30%,#4a2c17,#22150c)}
.nav:hover{border-color:var(--gold2)}
.nav:disabled{opacity:.3;cursor:default}
.where{font-family:var(--body);font-style:italic;color:var(--ui2);min-width:16em;text-align:center;font-size:15px}
.where b{font-style:normal;font-family:var(--display);font-weight:600;letter-spacing:.08em;color:var(--ui);font-size:13px}
.minibtn{font-family:var(--display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ui2);background:none;border:1px solid var(--line);border-radius:2px;padding:6px 10px;cursor:pointer}
.minibtn:hover{color:var(--gold2);border-color:rgba(201,164,76,.5)}
.measure{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none}

/* ---------- Mapa ---------- */
.mapframe{position:relative;flex:1 1 auto;min-height:320px;border-radius:4px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,rgba(80,52,28,.55),rgba(14,9,5,.9));
  box-shadow:inset 0 0 0 1px rgba(201,164,76,.3),inset 0 0 60px rgba(0,0,0,.7),0 10px 30px rgba(0,0,0,.5)}
@media (max-width:1100px){.mapframe{flex:none;height:min(78vw,620px);min-height:300px}}
.mapframe canvas{display:block;width:100%;height:100%;touch-action:none}
.maphead{position:absolute;z-index:6;left:10px;top:10px;right:10px;display:flex;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap}
.maphead > *{pointer-events:auto}
.mtitle{background:var(--panel);border:1px solid rgba(201,164,76,.35);padding:6px 12px;border-radius:2px;font-family:var(--display);font-size:12.5px;letter-spacing:.1em;color:var(--gold2);backdrop-filter:blur(3px);max-width:100%}
.mtitle i{font-family:var(--body);letter-spacing:0;color:var(--ui);font-size:14.5px;text-transform:none}
.mbtn{background:var(--panel);border:1px solid rgba(201,164,76,.35);color:var(--ui);border-radius:2px;height:30px;min-width:30px;cursor:pointer;font-size:14px}
.mbtn:hover{color:var(--gold2);border-color:var(--gold)}
.mapfoot{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid rgba(201,164,76,.3);border-radius:2px;padding:6px 10px;backdrop-filter:blur(3px)}
.mapfoot input[type=range]{flex:1;accent-color:#b8862e;min-width:60px}
.mapfoot .tl{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--ui2);white-space:nowrap}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;transform:translate(-50%,-100%);color:#2a1b0c;font-family:var(--body);font-size:12.5px;line-height:1;
  text-shadow:0 0 3px rgba(243,230,200,.95),0 0 6px rgba(243,230,200,.8);will-change:transform}
.lb.capital{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em}
.lb.site{font-style:italic}
.lb.ev{font-style:italic;font-weight:600;color:#7d1a12;font-size:12.5px}
.lb.hidden{display:none}
.tip{position:absolute;pointer-events:none;max-width:260px;background:rgba(241,228,198,.97);color:var(--text);border:1px solid var(--gold3);border-radius:2px;padding:7px 10px;font-size:14px;line-height:1.3;
  box-shadow:0 6px 18px rgba(0,0,0,.45);transform:translate(12px,12px);z-index:5}
.tip b{font-family:var(--display);font-size:12.5px;letter-spacing:.06em;color:var(--rubric);display:block;margin-bottom:2px}
.tip[hidden]{display:none}
.mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(14,9,5,.72);backdrop-filter:blur(3px);z-index:4}
.mapmsg[hidden]{display:none}
.mapmsg .box{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ui)}
.mapmsg .box p{margin:0;font-style:italic;color:var(--ui2)}
.mapmsg .seal{width:74px;height:74px}

.legend{flex:none;max-height:31%;min-height:150px;overflow:auto;background:rgba(20,13,8,.55);border:1px solid var(--line);border-radius:4px;padding:10px 12px 12px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 18px;align-content:start}
@media (max-width:1100px){.legend{max-height:none}}
.legend h4{grid-column:1/-1;margin:6px 0 2px;font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;padding:3px 4px;border-radius:2px;cursor:pointer}
.li:hover,.li.on{background:rgba(201,164,76,.12)}
.li .dot{width:14px;height:14px;border-radius:50%;margin-top:3px;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 -2px 2px rgba(0,0,0,.3)}
.li .dot.v{border-radius:2px;transform:rotate(45deg) scale(.82);box-shadow:0 0 0 1px #e05a40,0 0 6px rgba(224,90,64,.7)}
.li .flag{width:16px;height:12px;margin-top:4px;border:1px solid rgba(0,0,0,.6)}
.li .ev{width:16px;height:16px;margin-top:2px;color:#e0a24a;font-size:13px;line-height:16px;text-align:center}

<script>BOOKS[1]={n:1,t:"El ojo del mundo",en:"The Eye of the World",y:1990,era:"Año 998 de la Nueva Era",html:`
<p class="lead">Dos Ríos es un rincón olvidado de Andor donde nunca pasa nada. La víspera de Bel Tine, la Noche de Invierno, la Sombra llega a Campo de Emond buscando a tres muchachos.</p>

<h2>Prólogo: el Monte del Dragón</h2>
<p>Tres mil años atrás, al final de la Era de Leyendas, <b>Lews Therin Telamon</b>, el Dragón, ha enloquecido por la mácula que el Oscuro dejó en el <i>saidin</i> (la mitad masculina del Poder Único) y ha matado a toda su familia. <b>Elan Morin Tedronai</b>, el Traidor a la Esperanza, le devuelve un instante de cordura solo para que vea lo que ha hecho. Lews Therin se destruye absorbiendo demasiado Poder, y así nace el Monte del Dragón. Elan Morin promete que su lucha continuará.</p>

<h2>La trama</h2>
<h3>Noche de Invierno en Campo de Emond</h3>
<p><b>Rand al'Thor</b> y su padre <b>Tam</b> van al pueblo para las fiestas. Rand ve a un jinete de capa negra que no mueve la capa con el viento y desaparece; <b>Mat Cauthon</b> y <b>Perrin Aybara</b> también lo han visto. Llegan forasteros: una dama, <b>Moraine</b>, con su escolta <b>Lan</b>; el juglar <b>Thom Merrilin</b>, y el buhonero <b>Padan Fain</b>, que trae noticias de un falso Dragón en Ghealdan.</p>
<p>Esa noche los trollocs atacan la granja de los al'Thor y el pueblo. Tam saca una vieja espada con la marca de la garza y cae herido; Rand mata a un trolloc y lo arrastra hasta Campo de Emond. Febril, Tam le cuenta que lo encontró recién nacido en la ladera de una montaña, durante una guerra. Medio pueblo arde. Moraine se revela como <b>Aes Sedai</b> (Ajah Azul), Lan como su <b>Guardián</b>, y el jinete como un <b>Myrddraal</b>. Moraine cura a Tam y explica que el Oscuro busca a uno de tres chicos de la misma edad: Rand, Mat o Perrin. Si se quedan, el pueblo volverá a pagar. Tam le da a Rand la espada de la garza.</p>

<h3>La huida: Embarcadero de Taren y Baerlon</h3>
<p>Salen de noche Rand, Mat, Perrin, Moraine, Lan y Thom; <b>Egwene al'Vere</b> se les une por su cuenta. Un <b>Draghkar</b> los persigue. Cruzan el río en el Embarcadero de Taren y la barcaza se hunde detrás de ellos. Moraine le dice a Egwene que puede aprender a encauzar <i>saidar</i>. Su destino es Tar Valon, la ciudad de las Aes Sedai.</p>
<p>En <b>Baerlon</b> (posada El Ciervo y el León) los tres chicos sueñan con <b>Ba'alzamon</b>, que mata ratas partiéndoles el espinazo; al despertar hay ratas así de verdad. Rand conoce a <b>Min</b>, una joven que ve imágenes y auras alrededor de la gente. Los <b>Capas Blancas</b> (Hijos de la Luz), con <b>Dain Bornhald</b>, recorren la ciudad; Mat les gasta una broma. Padan Fain los ve y huye. Llega <b>Nynaeve al'Meara</b>, la Zahorí del pueblo, decidida a llevarse a los chicos a casa, y acaba uniéndose al grupo. Un Myrddraal entra en la posada y tienen que huir de noche.</p>

<h3>Shadar Logoth</h3>
<p>Acorralados por trollocs, se refugian en <b>Shadar Logoth</b> (antigua Aridhol), una ciudad muerta de la que hasta la Sombra huye. Allí <b>Mordeth</b>, un hombre sin sombra, intenta atraparlos, y <b>Mashadar</b>, la niebla asesina de la ciudad, separa al grupo. Mat se lleva de allí una <b>daga con un rubí</b>, contaminada por el mal de la ciudad.</p>

<h3>Tres caminos hacia Caemlyn</h3>
<p><b>Rand, Mat y Thom</b> suben al barco <i>Spray</i> de <b>Bayle Domon</b> y bajan por el Arinelle. En <b>Puente Blanco</b> un Myrddraal los alcanza; Thom se lanza contra él para que escapen y se le da por muerto. Rand y Mat siguen a pie, tocando la flauta y haciendo malabares en las posadas. En <b>Cuatro Reyes</b> un Amigo Siniestro, <b>Howal Gode</b>, los encierra y les ofrece poder; un rayo los libera. Mat está cada vez más desconfiado y huraño.</p>
<p><b>Perrin y Egwene</b> se encuentran con <b>Elyas Machera</b>, un hombre de ojos amarillos que habla con los lobos. Perrin tiene el mismo don y lo rechaza. Viajan con los <b>Tuatha'an</b> (Gitanos) de <b>Raen</b> e <b>Ila</b>, que viven según el Camino de la Hoja, y Egwene baila con su nieto <b>Aram</b>. Escondidos en un <i>stedding</i>, los capturan Capas Blancas al mando de <b>Geofram Bornhald</b>. Cuando matan al lobo Saltador, Perrin enloquece de rabia y mata a dos. Lo condenan a muerte. <b>Moraine, Lan y Nynaeve</b> los rescatan, con ayuda de los lobos. Desde entonces Perrin tiene los ojos amarillos.</p>
<p>Por el camino, Moraine le revela a Nynaeve que ella también puede encauzar, aunque lo hace sin saberlo, por rabia. Entre Nynaeve y Lan nace un amor que él se niega a admitir.</p>

<h3>Caemlyn</h3>
<p>Rand y Mat se alojan en La Bendición de la Reina, de <b>Basel Gill</b>, amigo de Thom. Rand conoce al ogier <b>Loial</b>, que le dice que es <i>ta'veren</i>: alguien que dobla el Entramado a su alrededor. Para ver pasar a <b>Logain</b>, el falso Dragón capturado, Rand trepa a un muro y cae en los jardines del palacio. Allí conoce a la heredera <b>Elayne Trakand</b> y a sus hermanos <b>Gawyn</b> y <b>Galad</b>. Lo llevan ante la reina <b>Morgase</b>, su consejera Aes Sedai <b>Elaida</b> (Ajah Rojo) y el capitán general <b>Gareth Bryne</b>. Elaida tiene una Predicción: dolor y división se extenderán por el mundo y Rand estará en el centro. Pide que lo encierren, pero la reina lo deja marchar.</p>
<p>El grupo se reúne en la posada. Mat, dominado por la daga, intenta matar a Moraine. Ella frena la corrupción, pero no puede romper el vínculo. Loial cuenta que un aiel le habló del <b>Ojo del Mundo</b>; los Gitanos también hablaban de él, y los tres chicos lo han soñado. Moraine decide que hay que protegerlo y que el único modo de llegar a tiempo son los <b>Atajos</b>, con Loial de guía.</p>

<h3>Los Atajos, Fal Dara y la Llaga</h3>
<p>Atraviesan los Atajos huyendo de <b>Machin Shin</b>, el Viento Negro, y salen en <b>Fal Dara</b> (Shienar), donde los recibe el señor <b>Agelmar Jagad</b> con su oficial <b>Ingtar</b>. Descubren a Padan Fain escalando la muralla. Moraine lo interroga: es un Amigo Siniestro al que el Oscuro convirtió en su sabueso; guió el ataque a Campo de Emond y los ha seguido hasta aquí. Los chicos se enteran de que Lan es el rey sin corona de <b>Malkier</b>, el reino que se tragó la Llaga.</p>
<p>Mientras el ejército de Shienar marcha al Paso de Tarwin, el grupo entra en la <b>Llaga</b>. El <b>Hombre Verde</b> (Someshta, el último nym) los lleva al Ojo, un estanque de <i>saidin</i> puro creado tras la mácula. Aparecen dos <b>Renegados</b> liberados: <b>Aginor</b> y <b>Balthamel</b>. El Hombre Verde mata a Balthamel y muere. Rand lucha con Aginor por el Poder del Ojo; Aginor no puede contenerlo y arde. Con ese Poder, Rand ve la batalla del <b>Paso de Tarwin</b> y destruye la hueste trolloc, y vence a Ba'alzamon con una espada de luz.</p>
<p>En el Ojo, ya vacío, aparecen el <b>Cuerno de Valere</b>, el <b>estandarte del Dragón</b> de Lews Therin y un <b>sello de la prisión del Oscuro, roto</b>. Rand comprende que encauza y que eso lleva a la locura; decide alejarse de sus amigos para no hacerles daño. Moraine se lo calla, pero ya lo sabe: el Dragón ha renacido.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Rand al'Thor</b>: pastor de Dos Ríos, hijo adoptivo de Tam; resulta que puede encauzar.</li>
<li><b>Matrim (Mat) Cauthon</b>: bromista y jugador; ligado a la daga de Shadar Logoth.</li>
<li><b>Perrin Aybara</b>: aprendiz de herrero, grande y reflexivo; hermano de los lobos.</li>
<li><b>Egwene al'Vere</b>: hija del posadero; puede encauzar y quiere ser Aes Sedai.</li>
<li><b>Nynaeve al'Meara</b>: la Zahorí del pueblo; encauza sin saberlo, por rabia.</li>
<li><b>Moraine Damodred</b>: Aes Sedai del Ajah Azul; lleva veinte años buscando al Dragón.</li>
<li><b>al'Lan Mandragoran</b>: su Guardián, rey sin trono de Malkier.</li>
<li><b>Thom Merrilin</b>: juglar, antiguo bardo de la corte de Morgase.</li>
<li><b>Loial</b>: ogier joven, erudito, que se ha ido del <i>stedding</i> sin permiso.</li>
<li><b>Min</b>: ve visiones alrededor de la gente.</li>
<li><b>Elayne, Gawyn, Galad, Morgase, Elaida, Gareth Bryne</b>: la corte de Andor.</li>
<li><b>Elyas Machera</b>: hermano de los lobos que guía a Perrin y Egwene. El lobo <b>Saltador</b> muere por los Capas Blancas.</li>
<li><b>Raen, Ila y Aram</b>: Tuatha'an. <b>Bayle Domon</b>: capitán illiano. <b>Basel Gill</b>: posadero.</li>
<li><b>Agelmar Jagad</b> e <b>Ingtar Shinowa</b>: señores de Shienar. <b>Logain Ablar</b>: falso Dragón, capturado.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Ba'alzamon</b>: aparece en los sueños de los chicos y dice ser el Oscuro. Rand lo vence al final.</li>
<li><b>Aginor</b> (muere, consumido por el Poder) y <b>Balthamel</b> (lo mata el Hombre Verde): los primeros Renegados que se ven libres.</li>
<li><b>Padan Fain</b>: Amigo Siniestro, sabueso del Oscuro; queda preso en Fal Dara.</li>
<li><b>Myrddraal, trollocs y Draghkar</b> persiguen al grupo. <b>Howal Gode</b>: Amigo Siniestro de Cuatro Reyes.</li>
<li>Aparte de la Sombra está el mal de <b>Shadar Logoth</b> (Mordeth, Mashadar), que se ha pegado a Mat a través de la daga.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Asalto trolloc a Campo de Emond</b> en Noche de Invierno: lo rechazan Moraine, Lan y los vecinos.</li>
<li><b>Persecución</b> de trollocs, Myrddraal y Draghkar desde Taren hasta Shadar Logoth y luego hasta Puente Blanco.</li>
<li><b>Capas Blancas de Geofram Bornhald</b> en las praderas al sur de Caralain: capturan a Perrin y Egwene.</li>
<li><b>Logain</b>, derrotado en Ghealdan, es llevado por Caemlyn camino de Tar Valon.</li>
<li><b>Batalla del Paso de Tarwin</b>: Shienar, con Agelmar, contra la hueste de la Llaga. Rand la decide con el Poder del Ojo.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Moraine</b>: llevar a los tres a Tar Valon y descubrir cuál es el Dragón. Usa los Atajos aunque sean un riesgo enorme.</li>
<li><b>Ba'alzamon</b>: atraer a los chicos en sueños para que le sirvan.</li>
<li><b>Elaida</b>: ve el peligro en Rand y pide que lo encierren.</li>
<li>Por el mundo se suceden falsos Dragones (Logain en Ghealdan) y los Capas Blancas persiguen a cualquiera que crean Amigo Siniestro.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>, en Fal Dara: sabe que encauza y quiere marcharse solo.</li>
<li><b>Mat</b>, en Fal Dara, enfermo y ligado a la daga.</li>
<li><b>Perrin</b>, en Fal Dara, con ojos amarillos y la voz de los lobos en la cabeza.</li>
<li><b>Egwene y Nynaeve</b>, en Fal Dara, decididas a ir a Tar Valon a formarse.</li>
<li><b>Moraine, Lan y Loial</b>, en Fal Dara. Guardan el Cuerno, el estandarte y el sello roto.</li>
<li><b>Thom</b>: dado por muerto en Puente Blanco.</li>
<li><b>Padan Fain</b>: encerrado en las mazmorras de Fal Dara.</li>
</ul>
`};

BOOKS[2]={n:2,t:"La gran cacería",en:"The Great Hunt",y:1990,era:"Año 998 NE, de primavera a otoño",html:`
<p class="lead">Unas semanas después del Ojo del Mundo. Todos siguen en Fal Dara y Rand quiere irse antes de que nadie descubra lo que es. Entonces llega la Amyrlin.</p>

<h2>Prólogo: Amigos Siniestros</h2>
<p>Un Amigo Siniestro llamado "Bors" acude a una reunión secreta con otros servidores de la Sombra de todas las naciones: nobles, mercaderes e incluso Aes Sedai, todos enmascarados. Ba'alzamon aparece y les da órdenes sobre tres jóvenes, Rand, Mat y Perrin, cuyas caras les hace ver.</p>

<h2>La trama</h2>
<h3>Fal Dara: la Amyrlin y el robo del Cuerno</h3>
<p>Lan entrena a Rand con la espada. Llega a Fal Dara la Sede Amyrlin, <b>Siuan Sanche</b>, con su Guardiana de las Crónicas <b>Leane</b> y otras Aes Sedai, entre ellas <b>Verin Mathwin</b> (Ajah Marrón) y <b>Liandrin</b> (Ajah Rojo). Rand intenta huir, pero las puertas están cerradas. Llegan noticias: en Illian se ha convocado la <b>Gran Cacería del Cuerno</b>, hay combates en la llanura de Almoth y los Capas Blancas de Geofram Bornhald van hacia allí.</p>
<p>De noche, Myrddraal y trollocs, ayudados por traidores de dentro, asaltan la fortaleza. Liberan a <b>Padan Fain</b> y se llevan el <b>Cuerno de Valere</b> y la <b>daga de Mat</b>, sin la cual Mat morirá. En la mazmorra queda escrita con sangre una profecía oscura; Verin la traduce y en ella se anuncia que la Hija de la Noche anda libre otra vez.</p>
<p>Siuan recibe a Rand en privado. Sabe que puede encauzar, pero no lo amansará: es el <b>Dragón Renacido</b>. Moraine le cuenta la Predicción que las llevó a buscarlo durante veinte años. Rand teme que solo quieran usarlo. Lan le da a Nynaeve su anillo de sello y le dice que lo olvide; ella decide ir a la Torre, entre otras cosas para poder plantar cara a Moraine.</p>

<h3>La cacería</h3>
<p>Para recuperar el Cuerno y la daga sale de Fal Dara una partida de lanceros shienarianos al mando de <b>Ingtar Shinowa</b>, con <b>Uno</b> y el husmeador <b>Hurin</b>, capaz de oler la violencia. Van con ellos Rand, Mat, Perrin y Loial. Ingtar nombra a Rand su segundo y le da a guardar, envuelto, el <b>estandarte del Dragón</b>. Siguen el rastro de Fain por aldeas vacías y encuentran a un Myrddraal asesinado. Mat y Perrin se enfrentan a Rand porque saben que encauza. Perrin pide ayuda a los lobos, que lo llaman <b>Joven Toro</b>. Verin se une a la partida diciendo que la envía Moraine.</p>

<h3>Rand en el mundo espejo</h3>
<p>Al tocar una <b>Piedra Portal</b>, Rand, Loial y Hurin aparecen en un mundo paralelo desierto y deformado. Ba'alzamon se le presenta, y al tocarle con la espada le deja <b>una garza grabada a fuego en la palma</b>. Rand salva a <b>Selene</b>, una bella dama "de Cairhien", del ataque de un <i>grolm</i>; ella lo halaga y le invita a buscar la gloria. Gracias a ella vuelven al mundo real por otra Piedra Portal, por delante de Fain, y Rand le roba el Cuerno y la daga de su campamento. Camino de Cairhien ven una estatua gigantesca a medio desenterrar que irradia <i>saidin</i>; Verin dirá después que es un <i>sa'angreal</i> capaz de destruir un país. Selene desaparece dejando una nota.</p>

<h3>Cairhien y el Juego de las Casas</h3>
<p>En <b>Cairhien</b> los nobles creen que Rand es un señor importante y le llueven invitaciones del <b>Juego de las Casas</b> (Daes Dae'mar). Rand las quema todas. En el arrabal encuentra vivo a <b>Thom Merrilin</b>, que vive con su joven amante y aprendiz <b>Dena</b>. Unos trollocs atacan a Rand y Loial; huyendo, Rand provoca un incendio en la casa gremial de los <b>Iluminadores</b>. La posada arde, Hurin cae herido y el Cuerno vuelve a desaparecer. Ingtar, Mat, Perrin y Verin llegan tarde.</p>
<p>Hurin sigue el rastro hasta la mansión de <b>Barthanes Damodred</b>, un Amigo Siniestro. Rand va a su fiesta mientras Mat registra la casa. Fain ha huido por una Puerta de los Atajos del jardín, y Machin Shin los espera al otro lado. Barthanes les da su mensaje: Fain los espera en <b>Punta de Toman</b>. Esa noche asesinan a Dena unos hombres del rey <b>Galldrian</b> que buscaban información sobre Rand. Thom los mata y decide matar al rey; su muerte sumirá Cairhien en la guerra civil.</p>

<h3>La Torre Blanca</h3>
<p>Egwene y Nynaeve viajan a Tar Valon con la Amyrlin. Moraine se separa del grupo antes de embarcar. Egwene es novicia y podría ser <b>Soñadora</b>. Nynaeve pasa la prueba de <b>Aceptada</b> por los tres arcos; en ellos ve a Aginor, un Campo de Emond gobernado por una Zahorí cruel y a Lan como marido. Egwene se hace amiga de la novicia <b>Elayne</b> y de <b>Min</b>, que trabaja en la Torre. También conoce a Galad, Gawyn y a Logain, ya amansado. Elaida interroga a Min sobre sus visiones.</p>
<p>Por su parte, Moraine estudia viejas profecías con las hermanas <b>Adeleas</b> y <b>Vandene</b>, y le dice a Lan que, si ella muere, su vínculo pasará a <b>Myrelle</b>, del Ajah Verde. Un Draghkar intenta matarla.</p>

<h3>Los seanchan</h3>
<p>Al otro lado del Océano Arith vuelven los descendientes de los ejércitos de <b>Artur Hawkwing</b>: los <b>seanchan</b>. Con barcos, bestias extrañas y mujeres encauzadoras esclavizadas, ocupan <b>Falme</b> y Punta de Toman. Encadenan a las mujeres que encauzan (<i>damane</i>) con un collar, el <b>a'dam</b>, controlado por las <i>sul'dam</i>. La capitana <b>Egeanin</b> captura el barco de Bayle Domon, y el Gran Señor <b>Turak</b>, maestro de la espada, se hace amigo de Domon. Fain llega a Falme y le entrega a Turak el Cuerno.</p>

<h3>Hacia Falme</h3>
<p>En el <b>stedding Tsofu</b>, a Loial le preocupa que lo casen (allí está <b>Erith</b>). Los Atajos están bloqueados por Machin Shin, así que Rand activa otra Piedra Portal. Cada uno vive miles de vidas posibles y aparecen en Punta de Toman cuatro meses después, en otoño.</p>
<p>En Tar Valon, Liandrin convence a Egwene y Nynaeve de que Rand corre peligro. Elayne y Min se suman, y las cuatro van por los Atajos hasta Punta de Toman. Allí <b>Liandrin las traiciona</b> y se las entrega a la Gran Señora <b>Suroth</b>. Egwene queda encadenada como <i>damane</i> a la sul'dam <b>Renna</b>, que llega a quitarle el nombre. Nynaeve y Elayne escapan y Min se queda cerca de Egwene. Con ayuda de Domon, ponen el collar a la sul'dam <b>Seta</b>, liberan a Egwene y dejan a Seta y Renna con el a'dam puesto.</p>

<h3>La batalla de Falme</h3>
<p>Verin envía a la ciudad a Rand, Mat, Perrin, Ingtar y Hurin. En casa de Turak recuperan el Cuerno y la daga, y Rand vence a Turak en duelo. Geofram Bornhald ataca a los seanchan con sus Capas Blancas y muere; antes ha mandado a <b>Jaret Byar</b> a contarle a su hijo Dain cómo acabó todo. <b>Ingtar confiesa que es Amigo Siniestro</b> y se queda a morir para cubrir la retirada.</p>
<p>Atrapado entre ejércitos, <b>Mat toca el Cuerno de Valere</b>. Aparecen los <b>Héroes del Cuerno</b>, entre ellos Artur Hawkwing y la arquera <b>Birgitte</b>, y barren a los seanchan hacia el mar. Perrin alza el estandarte del Dragón. Sobre Falme, todos ven a Rand luchar contra Ba'alzamon en el cielo; Rand lo hiere a cambio de recibir una <b>herida en el costado que no cerrará</b>. Min lo encuentra vivo. Selene se revela como la Renegada <b>Lanfear</b> y desaparece.</p>
<p>Al despertar, Rand tiene una garza en cada palma, como dicen las Profecías. Otro sello se ha roto. Los shienarianos lo reconocen como el Dragón Renacido y la noticia corre por todo el mundo. Mat queda ligado al Cuerno: mientras viva, solo él puede hacerlo sonar.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Siuan Sanche</b>: la Amyrlin, de origen humilde y muy astuta. <b>Leane</b>: su Guardiana de las Crónicas.</li>
<li><b>Verin Mathwin</b>: Ajah Marrón, distraída en apariencia, sabe muchísimo.</li>
<li><b>Liandrin</b>: Ajah Rojo; se revela traidora.</li>
<li><b>Sheriam</b>: Maestra de las Novicias. <b>Adeleas y Vandene</b>: hermanas eruditas.</li>
<li><b>Uno</b> y <b>Hurin</b>: shienarianos de la cacería.</li>
<li><b>Selene</b>: la misteriosa dama que resulta ser Lanfear.</li>
<li><b>Dena</b>: aprendiz de Thom, asesinada. <b>Barthanes Damodred</b> y el rey <b>Galldrian</b>, de Cairhien.</li>
<li><b>Turak, Suroth, Egeanin, Renna y Seta</b>: los seanchan.</li>
<li><b>Erith</b>: joven ogier de Tsofu. <b>Artur Hawkwing</b> y <b>Birgitte</b>: Héroes del Cuerno.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Ba'alzamon</b>: marca a Rand y lucha contra él sobre Falme; sale derrotado.</li>
<li><b>Lanfear</b>, como Selene, empuja a Rand hacia la gloria y se revela al final.</li>
<li><b>Padan Fain</b>, ahora libre, lleva el Cuerno a los seanchan y odia a Rand con locura propia.</li>
<li><b>Liandrin</b>, del <b>Ajah Negro</b>: traiciona a las chicas.</li>
<li><b>Ingtar</b>: Amigo Siniestro arrepentido que muere en Falme. <b>Barthanes</b>: Amigo Siniestro en Cairhien.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Asalto a Fal Dara</b> desde la Llaga para liberar a Fain y robar el Cuerno.</li>
<li><b>Lanceros de Ingtar</b>: de Fal Dara a Cairhien y, por Piedra Portal, a Punta de Toman.</li>
<li><b>Desembarco seanchan</b> en Falme y Punta de Toman, con combates en la llanura de Almoth.</li>
<li><b>Capas Blancas de Geofram Bornhald</b>: de la llanura de Almoth a Falme, donde quedan destrozados.</li>
<li><b>Batalla de Falme</b>: Héroes del Cuerno y shienarianos contra los seanchan, que se retiran al mar.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Siuan y Moraine</b> dejan libre a Rand en secreto: no lo entregan a la Torre ni lo amansan.</li>
<li><b>Fain</b> usa el Cuerno como cebo para atraer a Rand a Punta de Toman.</li>
<li><b>Cairhien</b>: el Juego de las Casas ve a Rand como una pieza más. La muerte del rey abre una guerra civil.</li>
<li><b>Los seanchan</b> buscan recuperar la tierra que creen suya (el Retorno), empezando por Punta de Toman.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: herido en Punta de Toman. Ya se sabe que es el Dragón. Min y los shienarianos se quedan con él.</li>
<li><b>Mat</b>: ha recuperado la daga y está ligado al Cuerno.</li>
<li><b>Perrin</b>: en Punta de Toman. Los Capas Blancas supervivientes lo culpan de lo de Falme.</li>
<li><b>Egwene, Nynaeve y Elayne</b>: libres, con Verin, que se lleva el Cuerno.</li>
<li><b>Moraine y Lan</b>: se reúnen con Rand.</li>
<li><b>Thom</b>: en Cairhien, tras vengar a Dena.</li>
<li><b>Seanchan</b>: expulsados de Falme, de momento.</li>
</ul>
`};

BOOKS[3]={n:3,t:"El dragón renacido",en:"The Dragon Reborn",y:1991,era:"Invierno del 998 NE a primavera del 999 NE",html:`
<p class="lead">Tras Falme, Rand se esconde en las montañas con Moraine, Lan, Perrin, Loial, Min y los shienarianos. Verin, Egwene, Nynaeve y Elayne llevan a Mat a Tar Valon para curarlo. Las Profecías señalan un sitio: la Ciudadela de Tear.</p>

<h2>Prólogo</h2>
<p>En la Fortaleza de la Luz, el Capa Blanca <b>Jaichim Carridin</b>, inquisidor y Amigo Siniestro, recibe de la Sombra dos órdenes contradictorias sobre Rand: matarlo y no tocarlo.</p>

<h2>La trama</h2>
<h3>Rand se marcha solo</h3>
<p>En el campamento de la montaña, la gitana <b>Leya</b> trae noticias de movimientos de los Capas Blancas en la llanura de Almoth. Min ve su muerte y, en efecto, Leya muere en un asalto trolloc en el que Perrin mata a su primer Myrddraal. Rand se siente impotente y atormentado. Decide probar quién es de la única forma indiscutible: tomar <b>Callandor</b>, "la espada que no es una espada", en el Corazón de la <b>Ciudadela de Tear</b>. Las Profecías dicen que la Ciudadela no caerá hasta que la empuñe el Dragón. Se va de noche, solo. Antes de irse a Tar Valon, Min le da a Perrin tres visiones: un aiel enjaulado, un gitano con espada y un halcón con un gavilán.</p>
<p>Por donde pasa, el efecto <i>ta'veren</i> de Rand deja un rastro de cosas extrañas: bodas en masa, golpes de suerte, desgracias. Lo persiguen Amigos Siniestros y sabuesos oscuros.</p>

<h3>Perrin, Moraine, Lan y Loial tras el rastro</h3>
<p>En <b>Jarra</b> (Ghealdan), Perrin ve a un hombre que se ha perdido por completo en el lobo y teme acabar igual. En el <b>sueño del lobo</b> se encuentra con <b>Saltador</b>, el lobo muerto, que empieza a enseñarle. En <b>Remen</b> un cazador del Cuerno tiene a un aiel enjaulado. Perrin lo libera y matan juntos a varios Capas Blancas. Es <b>Gaul</b>, de los Perros de Piedra, que se une al grupo. Moraine se entera de que <b>Masema</b>, un antiguo soldado de Shienar, predica al Dragón en Ghealdan. Se suma una joven cazadora del Cuerno, <b>Faile</b>, convencida de que Perrin la llevará hasta él; en <b>Illian</b> jura obedecer a Moraine. En Illian los atacan <b>Hombres Grises</b>, Moraine averigua que un Renegado gobierna la ciudad en la sombra, y en la huida destruye con <b>fuego compacto</b> a unos sabuesos oscuros.</p>
<p>Ya en Tear, Perrin trabaja en una herrería y le regalan un martillo. Moraine descubre que <b>Be'lal</b>, un Renegado, se hace pasar por Gran Señor. Faile cae en una trampa de sueño, un <i>ter'angreal</i> que era para Moraine; Perrin entra a propósito en el sueño, se abre paso como lobo y la saca de allí.</p>

<h3>Mat: de Tar Valon a Tear</h3>
<p>En la Torre, un círculo dirigido por Siuan con un <i>sa'angreal</i> <b>rompe el vínculo de Mat con la daga</b>. Al despertar habla la Lengua Antigua sin darse cuenta y sueña con batallas de Manetheren. Siuan le explica que está ligado al Cuerno y que no puede irse. Selene lo visita para tentarlo. Mat derrota a <b>Galad y Gawyn</b> a la vez con un bastón. Elayne le da una carta para su madre y la Amyrlin un permiso. Mat gana a los dados con una suerte imposible y encuentra a <b>Thom</b> borracho en Tar Valon. Por el río, cada noche los atacan Amigos Siniestros y Mat sale indemne. En <b>Aringill</b> salva a <b>Aludra</b>, una Iluminadora expulsada, que le regala fuegos artificiales.</p>
<p>En <b>Caemlyn</b>, el nuevo consejero y amante de la reina, el señor <b>Gaebril</b>, la tiene dominada. Mat trepa al palacio y oye a Gaebril ordenar a lord <b>Comar</b> que asesine a Elayne, Egwene y Nynaeve en Tear. Ante Morgase no consigue avisarla. Corre a Tear con Thom, se enfrenta a Comar y descubre que las chicas están presas en la Ciudadela.</p>

<h3>Egwene, Nynaeve y Elayne cazan al Ajah Negro</h3>
<p>Siuan nombra <b>Aceptadas</b> a Egwene y Elayne. Un Hombre Gris casi mata a Egwene y Nynaeve. La Amyrlin les encarga en secreto cazar al <b>Ajah Negro</b>: Liandrin y otras doce hermanas han huido de la Torre tras matar y robar <i>ter'angreal</i>. Verin le da a Egwene un anillo-<i>ter'angreal</i> para entrar en <b>Tel'aran'rhiod</b>, el Mundo de los Sueños, y una lista de las huidas. En una despensa cerrada encuentran pistas que apuntan a Tear y comprenden que es una trampa, pero van igualmente.</p>
<p>Río abajo conocen a tres <b>Doncellas Lanceras</b> aiel: <b>Aviendha</b>, <b>Bain</b> y <b>Chiad</b>. Nynaeve cura a una herida. Unos bandidos intentan venderlas a un Myrddraal y los aiel del jefe <b>Rhuarc</b> las rescatan. En Tear se alojan con la madre <b>Guenna</b> y contratan al cazador de ladrones <b>Juilin Sandar</b>. Pero Juilin está obligado por el Ajah Negro y las lleva a una emboscada: Liandrin escuda a Nynaeve y las encierra en la Ciudadela como cebo. Egwene, escudada y maltratada, entra en sueños en Tel'aran'rhiod y sin querer neutraliza a una de las Negras. Mat y un Juilin arrepentido abren un boquete con los fuegos de Aludra y las liberan.</p>

<h3>La caída de la Ciudadela</h3>
<p>Esa misma noche, mientras Mat vuela parte de la muralla, los aiel de Rhuarc asaltan la Ciudadela. Rand llega al Corazón de la Ciudadela y se encuentra con Be'lal; Moraine lo mata con fuego compacto. Aparece Ba'alzamon y reduce a Moraine. Rand <b>toma Callandor</b>, lo persigue al Mundo de los Sueños, corta los cordones negros que lo unen al Oscuro y <b>lo mata</b>. Después, Moraine admite que Ba'alzamon pudo ser en realidad <b>Ishamael</b>, uno de los Renegados, y no el Oscuro.</p>
<p>Rand es proclamado <b>Dragón Renacido</b> por las calles. Rhuarc explica que los aiel son "el Pueblo del Dragón" de la profecía: la Ciudadela no caería hasta que ellos llegaran. <b>Berelain</b>, la joven gobernante de Mayene, le entrega a Rand una carta de Lanfear en la que lo reclama como suyo.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Faile</b> (en realidad Zarine Bashere): cazadora del Cuerno, saldaeña, orgullosa. Se enamora de Perrin.</li>
<li><b>Gaul</b>: aiel de los Perros de Piedra, ligado a Perrin por una deuda.</li>
<li><b>Aviendha, Bain y Chiad</b>: Doncellas Lanceras. <b>Rhuarc</b>: jefe del clan Taardad.</li>
<li><b>Juilin Sandar</b>: cazador de ladrones de Tear. <b>Madre Guenna</b>: sabia de Tear.</li>
<li><b>Aludra</b>: Iluminadora que hace fuegos artificiales.</li>
<li><b>Berelain sur Paendrag</b>: gobernante de Mayene, coqueta y lista.</li>
<li><b>Masema</b>: soldado shienariano convertido en predicador del Dragón.</li>
<li><b>Gaebril</b>: señor que manda en la corte de Andor. <b>Jaichim Carridin</b>: inquisidor de los Capas Blancas.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Be'lal</b>: Renegado infiltrado entre los Grandes Señores de Tear. Lo mata Moraine.</li>
<li><b>Ba'alzamon</b>: muere en el Corazón de la Ciudadela a manos de Rand. Moraine cree que era el Renegado Ishamael.</li>
<li><b>Lanfear</b>: libre, reclama a Rand. Tienta a Mat como Selene.</li>
<li>Un Renegado gobierna Illian en secreto.</li>
<li><b>Ajah Negro</b>: Liandrin y doce más. Dos de ellas, Joiya y Amico, quedan presas en la Ciudadela; Liandrin huye.</li>
<li>Persiguen a los protagonistas <b>Hombres Grises</b>, <b>sabuesos oscuros</b> y Amigos Siniestros.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Asalto trolloc</b> al campamento de la montaña, en la que muere Leya.</li>
<li><b>Capas Blancas</b> moviéndose en la llanura de Almoth.</li>
<li><b>Aiel de Rhuarc</b>: cruzan el Espinazo del Mundo y Cairhien en busca de "El que Viene con el Alba". Entran en Tear y toman la Ciudadela.</li>
<li><b>Toma de la Ciudadela de Tear</b>: los aiel, Mat, Perrin y Moraine contra los Defensores y los Renegados.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: cumplir una profecía tan evidente que nadie pueda negar que es el Dragón.</li>
<li><b>Siuan</b>: usar en secreto a tres Aceptadas contra el Ajah Negro porque no sabe en qué hermanas confiar.</li>
<li><b>Gaebril</b> se adueña de Andor a través de Morgase y quiere eliminar a Elayne.</li>
<li><b>Masema</b> empieza en Ghealdan un movimiento de fanáticos del Dragón.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: señor de la Ciudadela de Tear, con Callandor. Lo llaman el Dragón Renacido.</li>
<li><b>Mat, Perrin, Egwene, Nynaeve, Elayne, Moraine, Lan, Loial, Thom, Faile, Juilin</b>: todos en Tear.</li>
<li><b>Aiel</b>: en la Ciudadela, con Rhuarc, Aviendha y Gaul.</li>
<li><b>Min</b>: en la Torre Blanca. <b>Morgase</b>: en Caemlyn, dominada por Gaebril.</li>
</ul>
`};

BOOKS[4]={n:4,t:"El ascenso de la Sombra",en:"The Shadow Rising",y:1992,era:"Primavera y verano del 999 NE",html:`
<p class="lead">Rand gobierna la Ciudadela de Tear con Callandor. Ba'alzamon, que todos creen que era Ishamael, ha muerto, pero la prisión del Oscuro se debilita y el mal se filtra por todas partes. El grupo se divide en cuatro historias.</p>

<h2>La trama</h2>
<h3>Tear: burbujas de maldad y despedidas</h3>
<p>Una <b>burbuja de maldad</b> recorre la Ciudadela: el hacha de Perrin intenta matarlo, las cartas de Mat cobran vida y los reflejos de Rand salen de los espejos para atacarle (Berelain se había colado en su cuarto). Las Negras presas aparecen muertas en sus celdas. Elayne y Rand empiezan un romance; Egwene le dice a Rand que ya no lo ama como antes. <b>Selene se presenta ante Rand como Lanfear</b> y le pide que se una a ella; él se niega. Poco después, trollocs y Myrddraal asaltan la Ciudadela y Rand los arrasa con Callandor.</p>
<p>En la Ciudadela hay un <i>ter'angreal</i> en forma de marco de puerta de piedra roja que da respuestas verdaderas. <b>Mat</b> lo cruza y los <b>aelfinn</b> le dicen que <b>debe ir a Rhuidean o morirá</b>, que <b>se casará con la Hija de las Nueve Lunas</b>, que <b>morirá y vivirá de nuevo</b> y que <b>renunciará a la mitad de la luz del mundo para salvar el mundo</b>. Rand y Moraine también lo cruzan y se guardan sus respuestas. Rand ordena enviar grano a Cairhien, que pasa hambre, y deja Callandor guardada con salvaguardas en el Corazón.</p>

<h3>El Yermo de Aiel</h3>
<p>Rand se lleva a Moraine, Lan, Egwene, Mat, Aviendha y los aiel por una <b>Piedra Portal</b> hasta Chaendaer, junto a <b>Rhuidean</b>, la ciudad sagrada. Allí los esperan las <b>Sabias</b>. Rand entra en Rhuidean con Mat. Entre las <b>columnas de cristal</b> revive la historia aiel a través de sus antepasados: los aiel eran los <b>Da'shain</b>, pacifistas al servicio de las Aes Sedai que seguían el Camino de la Hoja. Al empezar a usar lanzas se separaron de los que guardaron el Camino, los futuros Tuatha'an. Rand sale con <b>dragones grabados en los antebrazos</b>: es <b>El que Viene con el Alba</b>, el <i>Car'a'carn</i>. También se entera de que su madre fue <b>Shaiel</b>, una Doncella venida de fuera, y su padre <b>Janduin</b>, jefe de clan.</p>
<p>Mat cruza otra puerta retorcida y llega a los <b>eelfinn</b>. Le dan una lanza negra con cuervos (<i>ashandarei</i>), un <b>medallón de plata con cabeza de zorro</b> y <b>recuerdos de generales muertos</b>, y lo dejan colgado del árbol Avendesora. Rand lo descuelga y lo reanima. Moraine cruza los anillos de cristal y ve su futuro. Aviendha empieza su formación de Sabia y las Sabias le mandan vigilar a Rand y enseñarle las costumbres aiel. <b>Egwene</b> aprende a caminar por los sueños con <b>Amys, Bair y Melaine</b>.</p>
<p><b>Couladin</b>, de los <b>shaido</b>, también dice ser el Car'a'carn y se hace tatuar dragones falsos. Una caravana de buhoneros sigue al grupo, con <b>Hadnan Kadere</b>, la seductora <b>Isendre</b> y un juglar, <b>Jasin Natael</b>. Por el camino encuentran Imre Stand masacrada y rechazan a unos trollocs. En <b>Rocas Frías</b>, el dominio de Rhuarc, Couladin queda humillado, Rand gana una guardia de Doncellas Lanceras y los shaido se adelantan a Alcair Dal.</p>
<p>En <b>Alcair Dal</b>, donde las Doncellas lo adoptan como suyo, Rand revela ante los jefes de clan el secreto de Rhuidean: el origen pacifista de los aiel. Hay un escándalo enorme y Couladin se aprovecha. Rand trae lluvia al Yermo y persigue a <b>Asmodean</b>. Natael era el Renegado Asmodean, y Rand lo alcanza en Rhuidean <b>transitando</b> por primera vez. Ambos luchan con <b>llaves de acceso</b> conectadas a un <i>sa'angreal</i> gigantesco de Cairhien. Rand vence. <b>Lanfear deja a Asmodean escudado y aislado del Oscuro</b> para que haga de maestro de Rand, que lo mantiene a su lado disfrazado de juglar. Los shaido rompen con Rand y varios clanes no lo reconocen todavía.</p>

<h3>Dos Ríos</h3>
<p>Perrin se entera de que los Capas Blancas han ocupado Dos Ríos y lo buscan por Amigo Siniestro. Faile engaña a Loial para que la lleve por los Atajos; Perrin, Loial, Faile, Gaul, Bain y Chiad salen por la Puerta de los Atajos de Manetheren. Loial la cierra dejando las hojas de la llave por fuera. En sueños, Perrin persigue a <b>Matador</b>, que mata lobos en el sueño del lobo con su propio cuerpo, hasta la Torre de Ghenjei, donde Birgitte le advierte que no entre.</p>
<p>La granja de los Aybara está quemada: <b>toda la familia de Perrin ha sido asesinada</b>. Lo hizo <b>Ordeith</b>, un hombre que acompaña a los Capas Blancas y que resulta ser <b>Padan Fain</b>. Faile impide que Perrin se entregue. Con <b>Tam al'Thor</b>, <b>Abell Cauthon</b> y las Aes Sedai <b>Verin</b> y <b>Alanna</b>, Perrin libera presos del campamento de los Capas Blancas bajo una lluvia de Verin, agrupa a los granjeros en Campo de Emond y fortifica el pueblo bajo una bandera con una cabeza de lobo roja. Se les une un noble encantador, <b>lord Luc</b>. Los Tuatha'an de Raen se refugian allí y Aram coge una espada. Perrin hace un trato con los Capas Blancas de <b>Dain Bornhald</b>: si luchan junto al pueblo, después se entregará a ellos. Loial y Gaul vuelven a sellar la Puerta de los Atajos.</p>
<p>Perrin quiere poner a Faile a salvo y le pide que vaya a pedir ayuda a la reina a Caemlyn. Ella acepta <b>si se casan antes</b>, y se casan. Pero va a Colina del Vigía y vuelve con sus hombres. Tras días de ataques, los trollocs lanzan el asalto final. Los Capas Blancas no luchan. Los arqueros de Dos Ríos y los refuerzos de Faile rompen la hueste. Perrin, "Ojos Dorados", es ya el señor de Dos Ríos. Los Capas Blancas se van y lord Luc, que era Matador, desaparece.</p>

<h3>Tanchico</h3>
<p>Nynaeve y Elayne, con <b>Thom</b> y <b>Juilin</b>, viajan en el <i>Danzarina de las Olas</i> del <b>Pueblo del Mar</b>, cuya Detectora de Vientos encauza. En <b>Tanchico</b>, en plena guerra civil de Tarabon, se encuentran con <b>Bayle Domon</b> y con <b>Egeanin</b>, la capitana seanchan, que busca a unas sul'dam fugadas. Egeanin acaba ayudándolas. Una mujer desconocida las somete con Compulsión y les borra el recuerdo. Usando la <i>necesidad</i> en Tel'aran'rhiod, Nynaeve descubre que el Ajah Negro, con los Capas Blancas de Carridin, tiene presa a la Panarca <b>Amathera</b> en su palacio y busca un <b>a'dam para hombres</b> con el que controlar a Rand. Durante un motín asaltan el palacio, salvan a Amathera y se quedan el a'dam masculino y un sello. Nynaeve vence a la Renegada <b>Moghedien</b> y la escuda, pero esta escapa. Domon tira el a'dam al mar más profundo.</p>

<h3>La Torre Blanca se rompe</h3>
<p>Min llega a la Torre con un mensaje de Moraine para Siuan y ve auras de desastre. <b>Elaida</b> descubre el complot de Siuan y Moraine con el Dragón y da un golpe de Estado en la Antecámara. Siuan y Leane son depuestas y <b>neutralizadas</b>, y Elaida se proclama Sede Amyrlin. Min las libera y Gawyn las ayuda a cruzar la ciudad. Al huir se llevan a <b>Logain</b>, el falso Dragón amansado.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Amys, Bair, Melaine</b>: Sabias; Amys es Soñadora.</li>
<li><b>Couladin</b>: jefe sin derecho de los shaido, ambicioso.</li>
<li><b>Hadnan Kadere, Isendre, Jasin Natael</b>: los buhoneros.</li>
<li><b>Alanna Mosvani</b>: Ajah Verde. <b>Abell Cauthon</b>: el padre de Mat. <b>Lord Luc</b>: el noble que resulta ser Matador.</li>
<li><b>Ordeith</b>: consejero de los Capas Blancas, que es Padan Fain.</li>
<li><b>Amathera</b>: Panarca de Tarabon. Gente del <b>Pueblo del Mar</b>.</li>
<li><b>Shaiel y Janduin</b>: padres biológicos de Rand, ya muertos.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Lanfear</b>: se descubre, quiere a Rand para ella y maneja a Asmodean.</li>
<li><b>Asmodean</b>: vencido y escudado; maestro forzoso de Rand.</li>
<li><b>Moghedien</b>: en Tanchico, con el Ajah Negro. Huye.</li>
<li><b>Matador</b> (lord Luc): asesino capaz de entrar en carne y hueso en el sueño del lobo.</li>
<li><b>Padan Fain</b>, como Ordeith, mata a la familia de Perrin. <b>Hadnan Kadere</b>: Amigo Siniestro.</li>
<li><b>Ajah Negro</b> (Liandrin y otras) en Tanchico.</li>
<li>Sueltos por el mundo: burbujas de maldad, Hombres Grises, Draghkar y trollocs.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Ataque trolloc a la Ciudadela de Tear</b>, aniquilado con Callandor.</li>
<li><b>Hueste trolloc en Dos Ríos</b>, que llega por los Atajos de Manetheren. Derrotada en la <b>batalla de Campo de Emond</b>.</li>
<li><b>Capas Blancas de Dain Bornhald</b>: ocupan Dos Ríos y se retiran sin luchar.</li>
<li><b>Shaido de Couladin</b>: se separan en Alcair Dal y se ponen en marcha.</li>
<li><b>Golpe en la Torre Blanca</b>: los partidarios de Elaida contra los de Siuan.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: unir a los aiel como Car'a'carn para tener un ejército propio. Alimenta Cairhien con grano de Tear.</li>
<li><b>Lanfear</b> pone a Asmodean como maestro de Rand para atarlo a ella.</li>
<li><b>Elaida</b>: tomar la Torre y controlar al Dragón desde Tar Valon.</li>
<li>El <b>Ajah Negro</b> busca un a'dam para hombres para dominar a Rand.</li>
<li><b>Perrin</b>: defender Dos Ríos y convertir el pueblo en una fuerza unida.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>, en Alcair Dal, con los clanes divididos y Asmodean de maestro.</li>
<li><b>Mat</b>, con Rand, con recuerdos que no son suyos, lanza y medallón.</li>
<li><b>Egwene, Moraine, Lan, Aviendha</b>: con Rand en el Yermo.</li>
<li><b>Perrin y Faile</b>: casados, señores de Dos Ríos. Con ellos están <b>Loial, Gaul, Bain y Chiad</b>.</li>
<li><b>Nynaeve, Elayne, Thom, Juilin</b>: en Tanchico.</li>
<li><b>Siuan, Leane, Min y Logain</b>: huyen de Tar Valon. <b>Elaida</b>: Amyrlin.</li>
<li><b>Morgase</b>: en Caemlyn, dominada por Gaebril.</li>
</ul>
`};

BOOKS[5]={n:5,t:"Cielo en llamas",en:"The Fires of Heaven",y:1993,era:"Verano del 999 NE",html:`
<p class="lead">Los shaido de Couladin cruzan el Espinazo del Mundo hacia Cairhien y Rand va tras ellos con los clanes que le son fieles. La Torre está rota: Elaida en Tar Valon y las fugitivas buscando un refugio. Perrin no sale en este libro: sigue en Dos Ríos con Faile.</p>

<h2>Prólogo</h2>
<p>Padan Fain visita en secreto a la nueva Amyrlin, <b>Elaida</b>, y la envenena contra Rand. Cuatro Renegados sellan una alianza inestable entre ellos.</p>

<h2>La trama</h2>
<h3>Rand: del Yermo a Cairhien</h3>
<p>En Rhuidean, Rand se reúne con los jefes de clan mientras empiezan a llegarle recuerdos de una vida pasada. Moraine le da un sello frágil de la prisión del Oscuro y le promete no volver a manipularlo; acaba jurando obedecerle. Rand mata con <b>fuego compacto</b> a unos sabuesos oscuros, y Moraine le explica por qué ese tejido estaba prohibido: borra del Entramado hacia atrás. Moraine intenta curar a Mat y el medallón de zorro anula su tejido. Rand hace volver el agua a las fuentes de Rhuidean. Lanfear lo visita y le dice que <b>Rahvin</b> controla Caemlyn.</p>
<p>Por el <b>Paso de Jangai</b> encuentran aldeas quemadas: los shaido toman a la gente de las tierras húmedas como <i>gai'shain</i>, algo que va contra la costumbre. Aviendha le da a Rand la espada del rey Laman para saldar una deuda. Unos trollocs al servicio de <b>Sammael</b> atacan el campamento. Ya en Cairhien, Rand deja que los aiel tomen "la quinta parte" de los botines, pero prohíbe matar a quien no luche y llevarse comida. Unos tairenses escapan de la ciudad sitiada y le piden ayuda, y los señores cairhieninos le juran lealtad. El buhonero Kadere, Amigo Siniestro, mata a Isendre.</p>
<p>Rand sorprende a Aviendha bañándose y ella huye por un acceso hacia una ventisca. Él la rescata y, para salvarla del frío, acaban acostándose: empieza su relación. Al volver por el acceso ven a unos seanchan. Asmodean cubre su ausencia.</p>

<h3>La batalla de Cairhien</h3>
<p>Los shaido asedian Cairhien. Rand, Egwene y Aviendha lanzan rayos desde una torre de observación hasta agotarse, y Sammael la derriba, matando a varias Doncellas. Mat, que quería escaparse, acaba leyendo mapas y usando sin querer los recuerdos de generales muertos. Salva de una emboscada a soldados tairenses y cairhieninos y tiende una tenaza a los shaido. <b>Mat mata a Couladin</b> en combate. Nalesean y <b>Talmanes</b> lo proclaman general: es el nacimiento de la <b>Compañía de la Mano Roja</b>. Caen prisioneros veinte mil shaido; el resto huye hacia el norte, y algunos se ponen cintas rojas, "la lanza del Dragón". Rand rechaza el Trono del Sol (quiere dárselo a Elayne) y reparte la precedencia entre los nobles. Manda la mitad de los aiel a Tear, contra Illian.</p>
<p>Llegan noticias de que <b>Gaebril es en realidad Rahvin</b> y se ha proclamado rey de Andor, y de que Morgase está muerta. Melindhra, Doncella y amante de Mat, intenta matarlo y Mat la mata.</p>

<h3>Moraine y Lanfear</h3>
<p>Celosa por Aviendha, <b>Lanfear</b> mata a Kadere y reduce a Rand en los muelles de Cairhien. <b>Moraine se lanza contra ella y ambas cruzan el marco de puerta rojo</b>, el <i>ter'angreal</i> de los aelfinn, que se funde. Lan siente romperse el vínculo y se marcha: Moraine había dispuesto que su vínculo pasara a otra hermana. En una carta, Moraine le dice a Rand que sabía que esto pasaría, y que sabe que Natael es Asmodean.</p>

<h3>Caemlyn: la muerte de Rahvin</h3>
<p>Rand lleva a los aiel a Caemlyn por un acceso. Rahvin mata con rayos a <b>Mat, Aviendha y Asmodean</b>. Rand lo persigue hasta Tel'aran'rhiod, donde Nynaeve le ayuda desde Salidar, y lo destruye con fuego compacto. El fuego borra hacia atrás lo que Rahvin hizo en los últimos instantes, así que <b>Mat, Aviendha y Asmodean están vivos</b>. Esa noche, en el palacio, <b>alguien mata a Asmodean</b> sin que se sepa quién. <b>Davram Bashere</b> llega con un ejército saldaeño persiguiendo al falso Dragón Mazrim Taim. Rand proclama una <b>amnistía</b> para los hombres que encauzan.</p>

<h3>Siuan, Leane, Min y Logain: el refugio de Salidar</h3>
<p>En Kore Springs las fugitivas acaban condenadas por el señor del lugar, <b>Gareth Bryne</b>, a quien Morgase había apartado de la corte. Escapan gracias a Logain, y Bryne las persigue para que cumplan su palabra. La neutralización ha rejuvenecido el rostro de Siuan. En Lugard, un mensaje cifrado ("Sallie Daera") las lleva a <b>Salidar</b> (Altara), donde se reúnen las Aes Sedai que rechazan a Elaida, con <b>Sheriam</b> a la cabeza. Siuan las convence de elegir su propia Amyrlin. Bryne llega y acepta formarles un ejército, y Min ve que Siuan debe quedarse cerca de él.</p>

<h3>Nynaeve y Elayne: el circo y la huida</h3>
<p>Desde Tanchico cruzan Amadicia disfrazadas. En Mardecin, <b>Ronde Macura</b>, informante de la Torre de Elaida, las droga con raíz de horcaria; Thom y Juilin las sacan de allí. En Sienda las reconoce <b>Galad</b>, que ahora es Capa Blanca, y para esquivar a los Hijos de la Luz se esconden en el espectáculo ambulante de <b>Valan Luca</b>. En él trabajan la seanchan <b>Cerandin</b> y Aludra, que les da "palos de fuego". Elayne hace equilibrios y Nynaeve hace de diana para los cuchillos de Thom.</p>
<p>En Tel'aran'rhiod, Nynaeve conoce a <b>Birgitte</b>, la heroína del Cuerno. Por ella y por Egwene se enteran de que la Torre se ha dividido. <b>Moghedien</b>, que ahora controla a parte del Ajah Negro desde Amador, caza a Nynaeve; Birgitte le dispara y, en represalia, Moghedien la arranca del sueño al mundo real, donde se muere. <b>Elayne la vincula como su Guardiana</b> para salvarla. En <b>Samara</b> (Ghealdan) encuentran a Uno, a <b>Masema</b>, que ahora es "el Profeta" y recibe tributo de la reina Alliandre, y otra vez a Galad. Tras un motín por un barco, bajan por el río con refugiados, entre ellos Nicola y Areina, hasta Salidar. Allí vuelven a ser Aceptadas.</p>
<p>Durante la lucha contra Rahvin, Nynaeve vence a Moghedien en el sueño y <b>la captura con un a'dam</b>.</p>

<h3>Morgase</h3>
<p>Morgase despierta del dominio de Gaebril, descubre que ha desterrado a todos sus fieles y busca a Bryne sin encontrarlo. Huye de Caemlyn hacia Amadicia en busca de aliados, y el mundo la da por muerta. Mientras, Padan Fain recupera la daga de Shadar Logoth de la Torre Blanca.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Talmanes, Nalesean, Daerid</b>: los oficiales de Mat. <b>Melindhra</b>: Doncella y amante de Mat.</li>
<li><b>Valan Luca</b>, <b>Cerandin</b>: el espectáculo ambulante. <b>Birgitte</b>, ahora de carne y hueso.</li>
<li><b>Ronde Macura</b>, <b>Nicola</b>, <b>Areina</b>. <b>Sheriam</b> y las Aes Sedai de Salidar.</li>
<li><b>Davram Bashere</b>: mariscal general de Saldaea, padre de Faile.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Rahvin</b> (era Gaebril): destruido por Rand con fuego compacto.</li>
<li><b>Lanfear</b>: desaparece con Moraine por el marco de puerta.</li>
<li><b>Asmodean</b>: asesinado por alguien desconocido.</li>
<li><b>Moghedien</b>: capturada por Nynaeve.</li>
<li><b>Sammael</b>: manda trollocs contra Rand y derriba la torre de Cairhien.</li>
<li><b>Couladin</b>: muerto a manos de Mat. <b>Kadere</b> (lo mata Lanfear) y <b>Melindhra</b> (la mata Mat): Amigos Siniestros.</li>
<li><b>Padan Fain</b>: manipula a Elaida y recupera la daga.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Shaido</b>: cruzan el Espinazo, asedian Cairhien, son derrotados y huyen al norte.</li>
<li><b>Clanes de Rand</b>: siete clanes leales, seguidos por los indecisos.</li>
<li><b>Segunda batalla de Cairhien</b>: aiel, tairenses, cairhieninos y la futura Compañía de Mat contra los shaido.</li>
<li><b>Asalto a Caemlyn</b> por un acceso: aiel contra Rahvin y sus tropas.</li>
<li><b>Saldaeños de Bashere</b> en Caemlyn. <b>Ejército de Bryne</b> en formación en Salidar.</li>
<li>Mitad de los aiel enviada a Tear, como amenaza contra Illian.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: no quiere coronas; guarda el Trono del León y el del Sol para Elayne.</li>
<li><b>Amnistía</b> para los hombres que encauzan: Rand quiere reunirlos en vez de amansarlos.</li>
<li><b>Salidar</b> organiza la resistencia contra Elaida y busca su propia Amyrlin.</li>
<li><b>Masema</b> se convierte en una potencia fanática en Ghealdan.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand</b>: domina Caemlyn y Cairhien. Le acompañan <b>Mat</b> y <b>Aviendha</b>.</li>
<li><b>Egwene</b>: en Cairhien, con las Sabias.</li>
<li><b>Moraine</b>: desaparecida, se la da por muerta. <b>Lan</b>: se ha marchado solo.</li>
<li><b>Nynaeve, Elayne, Birgitte, Thom, Juilin</b>: en Salidar, con Moghedien cautiva.</li>
<li><b>Siuan, Leane, Min, Logain, Bryne</b>: en Salidar.</li>
<li><b>Morgase</b>: camino de Amadicia. <b>Galad</b>: con los Capas Blancas.</li>
<li><b>Perrin y Faile</b>: siguen en Dos Ríos, igual que <b>Loial</b>.</li>
</ul>
`};

BOOKS[6]={n:6,t:"El señor del caos",en:"Lord of Chaos",y:1994,era:"Del 999 al 1000 NE",html:`
<p class="lead">Rand gobierna Caemlyn y Cairhien. Hay dos Torres Blancas, una en Tar Valon y otra en Salidar, y las dos quieren al Dragón. En Shayol Ghul, el Oscuro da su consigna: "que reine el Señor del Caos".</p>

<h2>Prólogo</h2>
<p>En Shayol Ghul, <b>Demandred</b> se presenta ante el Oscuro a través de <b>Shaidar Haran</b>, un Myrddraal que es la mano del Oscuro, y recibe sus órdenes. El Oscuro devuelve la vida a dos Renegados muertos en otros cuerpos: <b>Osan'gar</b> y <b>Aran'gar</b>. Su toque sobre el mundo trae un <b>verano que no termina</b>: sequía y calor en pleno invierno.</p>

<h2>La trama</h2>
<h3>Rand: amnistía, Torre Negra y embajadas</h3>
<p><b>Mazrim Taim</b>, el falso Dragón de Saldaea, se presenta en Caemlyn, se somete a Rand y le entrega un sello de la prisión como prenda. Rand le encarga reunir y entrenar a los hombres que acuden a la amnistía en una granja a las afueras: será la <b>Torre Negra</b>. Les da rangos (Soldado, Dedicado y Asha'man) y pone a Taim al frente. Un Hombre Gris ataca a Rand y Taim lo mata. La voz de <b>Lews Therin</b> en la cabeza de Rand se hace cada vez más real.</p>
<p>Por un parecido descubre que su madre fue <b>Tigraine</b>, la heredera de Andor que desapareció, y que <b>Galad es su medio hermano</b>. Sammael le ofrece una tregua a través de un emisario bajo Compulsión, que muere al ser rechazado. Verin y Alanna traen a Caemlyn chicas de Dos Ríos para que sean Aes Sedai, y <b>Alanna vincula a Rand como Guardián sin su permiso</b>. Llegan a Caemlyn las enviadas de Salidar, con <b>Merana</b>, y con ellas <b>Min</b>, que se convierte en su apoyo y su amor. Min ve que unas mujeres que encauzan le harán daño.</p>
<p>En Cairhien, <b>Caraline Damodred</b> y <b>Toram Riatin</b> conspiran por el trono y llegan embajadores del Pueblo del Mar. Rand protege al erudito <b>Herid Fel</b>, que estudia cómo romper el vínculo de Guardián y la prisión del Oscuro. Un asesino de los Capas Blancas mata a la Doncella Desora. Los ogier vienen a reclamar a Loial, y Rand se lleva al Mayor <b>Haman</b> a Shadar Logoth para proteger allí la Puerta de los Atajos. Planea atacar Illian, el reino de Sammael, desde un campamento junto a Tear.</p>
<p>Llega a Cairhien la embajada de Elaida, con <b>Coiren</b> y <b>Galina</b>, y con los Cachorros de <b>Gawyn</b> como escolta. Rand les prohíbe acercarse a menos de una milla de su palacio.</p>

<h3>El secuestro y Dumai's Wells</h3>
<p>Coiren se presenta en el palacio con Aes Sedai escondidas en cofres. Escudan a Rand y se lo llevan prisionero <b>metido en un baúl</b>, con Min también presa, por el camino de Tar Valon. Lo apalean cada día. Durante la Fiesta de las Luces nadie lo encuentra, hasta que Berelain aparece con su espada y todos comprenden lo ocurrido.</p>
<p><b>Perrin</b>, que ha llegado de Dos Ríos con Faile, Loial y sus hombres y ha pasado por la prueba de los padres de Faile, dirige el rescate. Lleva a los hombres de Dos Ríos, a los mayenianos, a los cairhieninos de Dobraine, a los aiel de Rhuarc con las Sabias y a varias Aes Sedai rebeldes. Los lobos le guían. En <b>Dumai's Wells</b>, los <b>shaido de Sevanna</b> también rodean la caravana de la Torre: quieren a Rand para ellos. Rand rompe su escudo, Taim llega por accesos con los <b>Asha'man</b> y los shaido quedan arrasados. Las Aes Sedai rebeldes que venían con Perrin, con <b>Kiruna</b> y <b>Bera</b> a la cabeza, acaban <b>arrodilladas ante el Dragón</b> y le juran lealtad. Las de Elaida que sobreviven quedan presas, salvo las que huyen con Gawyn. Galina cae en manos de los shaido.</p>

<h3>Egwene, Amyrlin</h3>
<p>Egwene sigue con las Sabias en Cairhien y se reencuentra con Gawyn, que le promete no actuar contra Rand hasta saber si mató a su madre. Ella anuncia que algún día lo vinculará. Tras mentir sobre su preparación, acepta unos azotes para saldar su <i>toh</i> con las Sabias. Entonces la convocan a Salidar, adonde llega cruzando Tel'aran'rhiod <b>en carne y hueso</b>. La Antecámara rebelde, manejada por Sheriam, <b>la elige Sede Amyrlin</b>, convencida de que será una marioneta. Egwene nombra Guardiana a Sheriam y eleva a Aes Sedai a Nynaeve, Elayne, Theodrin y Faolain. Con Siuan como consejera en la sombra, empieza a mandar de verdad. Se entera de que Nynaeve tiene presa a Moghedien, y luego hace que Logain escape para que vaya con Rand. El ejército de Bryne se pone en marcha hacia Tar Valon.</p>

<h3>Nynaeve y Elayne: curaciones y el Cuenco</h3>
<p>En Salidar, con Moghedien cautiva bajo el disfraz de la sirvienta "Marigan", Nynaeve y Elayne hacen descubrimientos que presentan como suyos. Nynaeve <b>cura la neutralización</b>, algo que se creía imposible: primero a Logain, sin querer, y luego a Siuan y Leane. Elayne aprende a hacer <i>ter'angreal</i>. Buscando con la <i>necesidad</i> en sueños, localizan en <b>Ebou Dar</b> un <i>ter'angreal</i> capaz de arreglar el clima: el <b>Cuenco de los Vientos</b>. Egwene las envía allí con Aviendha, que había llegado a Salidar, Birgitte, Thom, Juilin y las hermanas Adeleas y Vandene.</p>

<h3>Mat</h3>
<p>Mat y la <b>Compañía de la Mano Roja</b> hacen una maniobra junto a Maerone que parece una marcha hacia Illian, para engañar a Sammael. Mat rescata a <b>Olver</b>, un huérfano. Rand le ordena traer a Elayne de Salidar, pero Egwene lo maneja para que acompañe a Elayne y Nynaeve a Ebou Dar. Thom le entrega una carta sellada de Rand. Bailando con <b>Halima</b>, la secretaria de una Asentada, el medallón se le enfría. En Ebou Dar conoce a la reina <b>Tylin</b> y a <b>Setalle Anan</b>, la posadera de La Mujer Errante.</p>

<h3>Morgase en Amador</h3>
<p>Morgase busca aliados en Amadicia y acaba como "invitada" de <b>Pedron Niall</b>, el Lord Capitán Comandante de los Capas Blancas. Tras ver ejecutar a unos Amigos Siniestros, firma el tratado de Niall, que da a los Capas Blancas enormes privilegios en Andor a cambio de ayudarla a recuperar el trono. Se entera de que Galad se ha unido a los Hijos de la Luz. Niall difunde que Rand es una marioneta del Ajah Negro.</p>

<h3>Epílogo</h3>
<p>Un <b>gholam</b>, una criatura de la Sombra a la que el Poder no afecta, mata a Herid Fel en Cairhien. En Salidar, <b>Aran'gar</b>, que vivía allí como Halima, libera a Moghedien de su a'dam y la lleva a Shayol Ghul. En Ebou Dar, la Negra Falion trama atrapar a Elayne y Nynaeve.</p>

<h2>Personajes nuevos</h2>
<ul>
<li><b>Mazrim Taim</b> y los primeros <b>Asha'man</b>. <b>Olver</b>. <b>Herid Fel</b>.</li>
<li><b>Merana</b>: enviada de Salidar. <b>Kiruna, Bera</b>: Aes Sedai rebeldes. <b>Coiren, Galina, Katerine</b>: embajada de Elaida.</li>
<li><b>Sevanna</b>: viuda de jefes shaido, ambiciosa; manda sobre los shaido.</li>
<li><b>Caraline Damodred, Toram Riatin</b>: rebeldes cairhieninos. <b>Dobraine</b>: noble leal a Rand.</li>
<li><b>Tylin</b>: reina de Altara. <b>Setalle Anan</b>: posadera de Ebou Dar.</li>
<li><b>Halima</b>, <b>Theodrin</b>, <b>Faolain</b>, <b>Tarna Feir</b>.</li>
<li><b>Pedron Niall, Eamon Valda, Rhadam Asunawa</b>: los mandos de los Capas Blancas.</li>
</ul>

<h2>La Sombra</h2>
<ul>
<li><b>Demandred</b>: obedece al Oscuro, que quiere caos. Nadie sabe dónde está.</li>
<li><b>Sammael</b>: desde Illian, ofrece tregua y trama ser el Nae'blis, el elegido del Oscuro.</li>
<li><b>Graendal</b>: en Arad Doman, manipula a Sammael. <b>Semirhage</b>: tortura a una Aes Sedai capturada.</li>
<li><b>Osan'gar y Aran'gar</b>: Renegados que han vuelto a la vida; Aran'gar estaba infiltrada en Salidar como Halima.</li>
<li><b>Shaidar Haran</b>: la mano del Oscuro. <b>Gholam</b>: asesino inmune al Poder.</li>
<li><b>Moghedien</b>: liberada al final.</li>
</ul>

<h2>Ejércitos y batallas</h2>
<ul>
<li><b>Torre Negra</b>, cerca de Caemlyn: cientos de alumnos al acabar el libro.</li>
<li><b>Compañía de la Mano Roja</b>: maniobra de engaño junto a Maerone.</li>
<li><b>Ejército contra Illian</b>, que se reúne en Tear.</li>
<li><b>Ejército rebelde de Gareth Bryne</b>: sale de Salidar rumbo a Tar Valon.</li>
<li><b>Embajada de Elaida y Cachorros de Gawyn</b>: de Tar Valon a Cairhien, y de allí a Dumai's Wells.</li>
<li><b>Batalla de Dumai's Wells</b>: Perrin, aiel, Asha'man, mayenianos y cairhieninos contra los shaido de Sevanna y la Torre.</li>
</ul>

<h2>Estrategias y política</h2>
<ul>
<li><b>Rand</b>: crear su propio ejército de encauzadores, atacar a Sammael y mantener a las Aes Sedai a distancia.</li>
<li><b>Elaida</b>: secuestrar a Rand y llevarlo a la Torre.</li>
<li><b>Salidar</b>: una Amyrlin que crean manejable. Egwene les sale respondona.</li>
<li><b>Sevanna</b>: apoderarse del Car'a'carn para gobernar a los aiel.</li>
<li><b>Niall</b>: usar a Morgase para justificar una invasión de Andor.</li>
</ul>

<h2>Cómo queda todo</h2>
<ul>
<li><b>Rand y Min</b>: en Dumai's Wells, libres, con Aes Sedai que le han jurado lealtad.</li>
<li><b>Perrin</b>, <b>Loial</b> y los aiel: en Dumai's Wells. <b>Faile</b>: en Cairhien.</li>
<li><b>Egwene</b>: Amyrlin de los rebeldes, en marcha hacia Tar Valon con Siuan y Bryne.</li>
<li><b>Mat, Nynaeve, Elayne, Aviendha, Birgitte, Thom</b>: en Ebou Dar.</li>
<li><b>Lan</b>: retenido en secreto por Myrelle, que ha recibido su vínculo.</li>
<li><b>Logain</b>: camino de la Torre Negra. <b>Gawyn</b>: huye con los Cachorros.</li>
<li><b>Morgase</b>: prisionera de lujo en Amador.</li>
</ul>
`};

BOOKS[7]={n:7,t:"La corona de espadas",en:"A Crown of Swords",y:1996,era:"Mes de Taisham del 1000 NE (apenas diez días)",html:`
<p class="lead">El libro cubre muy poco tiempo, poco más de una semana tras Dumai's Wells. Rand tiene Aes Sedai prisioneras y otras juradas a su servicio. En Ebou Dar, la búsqueda del Cuenco de los Vientos se convierte en una carrera contra la Sombra y contra el calor.</p>

<h2>Prólogo</h2>
<p>Elaida ordena a <b>Alviarin</b>, su Guardiana de las Crónicas, enviar hermanas a destruir la Torre Negra, y Mesaana enseña en secreto a Alviarin a <b>Viajar</b>. Sevanna y Gawyn escapan de Dumai's Wells. En Amador asesinan a <b>Pedron Niall</b> y <b>Eamon Valda</b> se convierte en Lord Capitán Comandante de los Capas Blancas.</p>

<h2>La trama</h2>
<h3>Rand: Cairhien, Cadsuane y la daga</h3>
<p>Tras la batalla, Rand busca entre los muertos a las Doncellas caídas y elige como acompañante a un Asha'man, <b>Corlan Dashiva</b>. Al volver a Cairhien descubre que <b>Colavaere</b> se ha hecho con el Trono del Sol con métodos sucios; Rand le quita la corona y sus tierras. Faile estaba infiltrada entre sus damas. Las Aes Sedai de Elaida que han caído prisioneras quedan bajo custodia de las Sabias, que las tratan con dureza.</p>
<p>Aparece <b>Cadsuane Melaidhrin</b>, una Aes Sedai verde legendaria y muy anciana. Pone a prueba la cordura de Rand sin ningún miedo, y desde su visita la voz de Lews Therin se calla un tiempo. Min y Rand se consuelan tras varias muertes, entre ellas un ataque del gholam. Rand encarga a Merana cerrar un pacto con el Pueblo del Mar.</p>
<p>Disfrazado, Rand va con Min a ver a los rebeldes cairhieninos de <b>Caraline Damodred</b> y <b>Toram Riatin</b>, entre los que está el tairense <b>Darlin Sisnera</b>. Con ellos está <b>Padan Fain</b>. Toram reta a Rand a un duelo, una burbuja de maldad lo interrumpe y en la confusión <b>Fain le hace un corte a Rand con la daga de Shadar Logoth</b>, junto a la vieja herida. Cadsuane lo lleva a que lo curen los Asha'man; el veterano <b>Damer Flinn</b> le salva la vida.</p>
