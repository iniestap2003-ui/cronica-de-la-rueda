  P.push({type:"cover",html:`<div class="cover"><div class="ctr">${wheel("cv-emb")}<div class="cv-title">CRÓNICA<br>DE LA RUEDA</div><div class="cv-sub">Los catorce libros de La Rueda del Tiempo</div><div class="cv-hint">Pulsa para abrir</div></div></div>`});
  P.push({type:"endpaper",html:`<div class="endpaper"></div>`});
  P.push({type:"front",html:`<div class="page"><div class="ctr">${ORN}<div class="tp-num">Crónica de</div><div class="tp-title">La Rueda del Tiempo</div><p class="tp-hint" style="font-size:1em">Los catorce libros de Robert Jordan y Brandon Sanderson, resumidos uno a uno: quién está dónde, qué busca, quién aparece, quién cae, qué ejércitos se mueven y por qué.</p>${wheel("orn")}<div class="tp-era">Edición con sellos de lacre</div></div></div>`});
  P.push({type:"note",html:`<div class="page note"><div class="pc"><h2>Advertencia al lector</h2>
   <p>Cada libro empieza en una página nueva, detrás de su portadilla. Desde la portadilla no se ve nada del libro: hay que pasar la hoja.</p>
   <p>Los libros que aún no has leído llevan un <b>sello de lacre</b>. Elige arriba hasta qué libro has terminado, o rompe el sello de uno concreto en su portadilla. Mientras siga sellado, el mapa no muestra sus movimientos.</p>
   <p>El <b>mapa</b> enseña el libro que tienes abierto. Se puede girar, acercar y recorrer; la línea de tiempo repite los movimientos.</p>
   <p>Los nombres siguen la traducción española: Moraine, los Renegados, el fuego compacto, la Ciudadela de Tear.</p>
   <p>Cada resumen se ha contrastado con las sinopsis capítulo a capítulo de Dragonmount, con Wikipedia y con la wiki de La Rueda del Tiempo.</p></div></div>`});
  P.push({type:"toc",html:""});
  P.push({type:"legend",html:`<div class="page note legendpg"><div class="pc"><h2>Leyenda del mapa</h2>
   <ul><li><span class="sw" style="background:#b3322a;border-radius:50%;width:1.1em"></span>Peón de color: un personaje.</li>
   <li><span class="sw" style="background:#1a1a1a;transform:rotate(45deg) scale(.7);box-shadow:0 0 0 2px #e05a40;width:1.1em"></span>Piedra negra: la Sombra.</li>
   <li><span class="sw" style="background:#c9a44c"></span>Estandarte: un ejército. Su color dice el bando:</li></ul>
   <ul>${Object.values(SIDES).map(s=>`<li><span class="sw" style="background:linear-gradient(90deg,${s[1]} 0 70%,${s[2]} 70%)"></span>${s[0]}</li>`).join("")}</ul>
   <ul><li><span class="sw" style="background:none;border:none;color:#8e2219">⚔</span>Batalla o hecho clave.</li></ul></div></div>`});
  for(let n=1;n<=14;n++){
    if(P.length%2===1)P.push({type:"filler",book:n-1,html:fillerHTML(n-1)});
    S.titleIdx[n]=P.length;
    P.push({type:"title",book:n,html:`<div class="page">${titleHTML(n)}</div>`});
    if(isSealed(n)){P.push({type:"sealed",book:n,html:`<div class="page"><div class="ctr">${seal("seal")}<p class="sealtxt">Las páginas de este libro siguen lacradas.</p>${ORN}</div></div>`});continue}
    const pages=paginateHTML(BOOKS[n].html);
    pages.forEach((h,i)=>P.push({type:"content",book:n,inner:h,first:i===0}));
  }
  if(P.length%2===1)P.push({type:"filler",book:14,html:fillerHTML(14)});
  P.push({type:"colophon",html:`<div class="page"><div class="ctr">${ORN}<div class="tp-title" style="font-size:1.5em">Fin de la crónica</div><p class="tp-hint">La Rueda gira. Las Eras vienen y se van.</p>${wheel("orn")}</div></div>`});
  P.push({type:"backcover",html:`<div class="cover" style="transform:scaleX(-1)"><div class="ctr" style="transform:scaleX(-1)">${wheel("cv-emb")}</div></div>`});
  // folios
  P.forEach((p,i)=>{p.idx=i;p.folio=i>=2&&p.type!=="backcover"?i-1:null});
  // índice
  P[4].html=`<div class="page toc"><div class="pc"><h2>Índice</h2><ol>${Array.from({length:14},(_,k)=>{const n=k+1;return `<li data-gobook="${n}"><span class="rn">${ROMAN[n]}</span><span class="tt">${BOOKS[n].t}${isSealed(n)?'<span class="sx" title="Sellado"></span>':""}</span><span class="dots"></span><span class="pg">${P[S.titleIdx[n]].folio}</span></li>`}).join("")}</ol></div><div class="folio">${P[4].folio}</div></div>`;
  S.pages=P;
}
function fillerHTML(n){return `<div class="page"><div class="ctr">${n>0&&!isSealed(n)?`<div class="tp-num" style="opacity:.8">Aquí termina el Libro ${ROMAN[n]}</div>`:""}${ORN}</div></div>`}
function pageHTML(p,side){
  if(p.type==="content"){const B=BOOKS[p.book];const rh=side==="back"?`Libro ${ROMAN[p.book]}`:B.t;
    let inner=p.inner;if(p.first)inner=inner.replace('<p class="lead">','<p class="lead">');
    return `<div class="page"><div class="rh">${rh}</div><div class="pc">${inner}</div><div class="folio">${p.folio}</div></div>`}
  if(p.type==="note"||p.type==="legend")return p.html.replace(/<\/div><\/div>$/,`</div><div class="folio">${p.folio}</div></div>`);
  return p.html;
}

/* ---------- Hojas ---------- */
function seq(){return S.mode==="single"?S.pages.filter(p=>p.type!=="filler"&&p.type!=="endpaper"):S.pages}
function render(keepPageIdx){
  const pages=seq();S.seq=pages;
  bookEl.innerHTML="";bookEl.classList.toggle("single",S.mode==="single");
  const W=S.mode==="single"?S.pw:S.pw*2;bookEl.style.width=W+"px";bookEl.style.height=S.ph+"px";
  bookEl.insertAdjacentHTML("beforeend",`<div class="board l"></div><div class="board r"></div><div class="stack l"></div><div class="stack r"></div>`);
  S.leaves=[];
  const per=S.mode==="single"?1:2;S.L=Math.ceil(pages.length/per);
  for(let j=0;j<S.L;j++){
    const f=pages[j*per],b=per===2?pages[j*per+1]:null;
    const leaf=document.createElement("div");leaf.className="leaf";
    leaf.style.left=S.mode==="single"?"0":"50%";leaf.style.width=S.mode==="single"?"100%":"50%";
    leaf.innerHTML=`<div class="face front">${f?pageHTML(f,"front"):""}</div><div class="face back">${b?pageHTML(b,"back"):(S.mode==="single"?'<div class="page"></div>':"")}</div>`;
    bookEl.appendChild(leaf);S.leaves.push(leaf);
  }
  let target=0;
  if(keepPageIdx!=null){const pos=pages.findIndex(p=>p.idx>=keepPageIdx);const pi=pos<0?pages.length-1:pos;target=S.mode==="single"?pi:Math.ceil(pi/2);if(S.mode!=="single"&&pi%2===1)target=(pi+1)/2}
  setCur(target,true);
}
function zFor(j){const l=S.leaves[j];return l.classList.contains("flipped")?j+1:S.L*2-j}
function setVis(){const lo=S.cur-2,hi=S.cur+1;
  S.leaves.forEach((l,j)=>{const show=(j>=lo&&j<=hi)||l.classList.contains("turning");l.style.display=show?"":"none";if(!l.classList.contains("turning"))l.style.zIndex=zFor(j);
    if(S.mode==="single"&&l.classList.contains("flipped")&&!l.classList.contains("turning"))l.style.visibility="hidden";else l.style.visibility=""})}
function shift(){let x=0;if(S.mode==="spread"){if(S.cur===0)x=-S.pw/2;else if(S.cur===S.L)x=S.pw/2}
  bookEl.style.transform=`translateX(${x}px)`;
  const b=bookEl.querySelectorAll(".board");if(b.length){b[0].style.opacity=S.cur>0?1:0;b[1].style.opacity=S.cur<S.L?1:0;
   if(S.mode==="single"){b[0].style.display="none";b[1].style.width="calc(100% + 20px)"}}
  const st=bookEl.querySelectorAll(".stack");if(st.length&&S.L){st[0].style.width=(S.cur>0?Math.max(2,10*S.cur/S.L):0)+"px";st[1].style.width=(S.cur<S.L?Math.max(2,10*(S.L-S.cur)/S.L):0)+"px";
   if(S.mode==="single")st[0].style.display="none"}}
function setCur(t,instant){t=Math.max(0,Math.min(S.L,t));
  S.leaves.forEach((l,j)=>{l.classList.add("instant");l.classList.toggle("flipped",j<t)});
  S.cur=t;setVis();shift();void bookEl.offsetWidth;S.leaves.forEach(l=>l.classList.remove("instant"));after()}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function flipTo(t){
  t=Math.max(0,Math.min(S.L,t));if(t===S.cur||S.busy)return;
  S.busy=true;window.__crwFlipping=true;const fwd=t>S.cur;const list=[];
  if(fwd)for(let j=S.cur;j<t;j++)list.push(j);else for(let j=S.cur-1;j>=t;j--)list.push(j);
  const anim=list.slice(-4),inst=list.slice(0,-4);
  inst.forEach(j=>{const l=S.leaves[j];l.classList.add("instant");l.classList.toggle("flipped",fwd)});
  void bookEl.offsetWidth;inst.forEach(j=>S.leaves[j].classList.remove("instant"));
  S.cur=t;shift();
  anim.forEach((j,k)=>{const l=S.leaves[j];l.style.display="";l.style.visibility="";l.classList.add("turning");l.style.zIndex=4000+k;void l.offsetWidth;
    setTimeout(()=>{l.classList.toggle("flipped",fwd)},reduce?0:20+k*110)});
  const total=reduce?40:(anim.length-1)*110+1010;
  setTimeout(()=>{anim.forEach(j=>S.leaves[j].classList.remove("turning"));S.busy=false;window.__crwFlipping=false;setVis();after()},total);
  setVis();
}
const next=()=>flipTo(S.cur+1),prev=()=>flipTo(S.cur-1);

/* ---------- Estado visible ---------- */
function visiblePages(){const s=S.seq;if(S.mode==="single")return [null,s[S.cur]||null];return [s[S.cur*2-1]||null,s[S.cur*2]||null]}
function after(){
  const [l,r]=visiblePages();
  const cands=[l,r].filter(p=>p&&p.book>0&&(p.type==="content"||p.type==="filler"||(p.type==="title"&&!isSealed(p.book)))).map(p=>p.book);
  let mb=cands.length?Math.max(...cands):null;
  if(mb&&mb!==S.mapBook){S.mapBook=mb;emitBook(mb)}
  const anyBook=(r&&r.book)||(l&&l.book)||0;
  // barra
  const lbl=$("#where");const ref=r||l;
  if(!ref||ref.type==="cover")lbl.innerHTML=`<b>CRÓNICA DE LA RUEDA</b> · pulsa la tapa para abrir`;
  else if(anyBook){const fol=[l,r].filter(Boolean).map(p=>p.folio).filter(Boolean);lbl.innerHTML=`<b>LIBRO ${ROMAN[anyBook]}</b> · ${BOOKS[anyBook].t}${fol.length?` · pág. ${fol.join("–")}`:""}`}
  else lbl.innerHTML=`<b>PRELIMINARES</b> · índice y leyenda`;
  $("#booksbtnlbl").textContent=anyBook?`Libro ${ROMAN[anyBook]}`:"Libros";
  $("#prev").disabled=S.cur===0;$("#next").disabled=S.cur===S.L;
  document.querySelectorAll(".rb").forEach(b=>b.setAttribute("aria-current",String(+b.dataset.book===anyBook)));
  const sp=S.seq[S.mode==="single"?S.cur:S.cur*2]||S.seq[S.cur*2-1];if(sp)store.set("pos",sp.idx);
}

/* ---------- Navegación por libro ---------- */
function goBook(n){const idx=S.titleIdx[n];const pos=S.seq.findIndex(p=>p.idx===idx);const t=S.mode==="single"?pos:pos/2;
  if(Math.abs(t-S.cur)>1&&!reduce){flipTo(t)}else flipTo(t);
  if(!isSealed(n)&&S.mapBook!==n){S.mapBook=n;emitBook(n)}}
function rebuild(){const [l,r]=visiblePages();const keep=(r||l)?(r||l).idx:0;build();render(keep);ribbon();}
function unseal(n){S.unsealed.add(n);store.set("unsealed",[...S.unsealed]);rebuild();
  document.dispatchEvent(new CustomEvent("crw:seals"));
  S.mapBook=n;emitBook(n)}

/* ---------- Cinta de libros ---------- */
function ribbon(){const r=$("#ribbon");r.innerHTML="";for(let n=1;n<=14;n++){const b=document.createElement("button");b.className="rb"+(isSealed(n)?" sealed":"");b.dataset.book=n;b.textContent=ROMAN[n];
  b.title=`Libro ${ROMAN[n]}: ${BOOKS[n].t}${isSealed(n)?" (sellado)":""}`;b.onclick=()=>{if(isApp())setTab("libro");goBook(n)};r.appendChild(b)}
  const sel=$("#readsel");sel.value=String(S.readUpTo);}
function setupSelect(){const sel=$("#readsel");sel.innerHTML=`<option value="0">ninguno</option>`+Array.from({length:14},(_,k)=>`<option value="${k+1}">Libro ${ROMAN[k+1]}</option>`).join("");
  sel.value=String(S.readUpTo);sel.onchange=()=>{S.readUpTo=+sel.value;store.set("readUpTo",S.readUpTo);S.unsealed=new Set([...S.unsealed].filter(n=>n>S.readUpTo));store.set("unsealed",[...S.unsealed]);rebuild();document.dispatchEvent(new CustomEvent("crw:seals"))}}

/* ---------- Pestañas (móvil) ---------- */
const isApp=()=>matchMedia("(max-width:760px)").matches;
function closeSheet(){document.body.classList.remove("sheet-open");$("#booksbtn").setAttribute("aria-expanded","false")}
function setTab(t){document.body.dataset.tab=t;document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===t)));closeSheet()}
document.body.dataset.tab="libro";
document.addEventListener("crw:tab",e=>setTab(e.detail));

/* ---------- Eventos ---------- */
function wire(){
  document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $("#booksbtn").onclick=e=>{e.stopPropagation();const o=!document.body.classList.contains("sheet-open");document.body.classList.toggle("sheet-open",o);$("#booksbtn").setAttribute("aria-expanded",String(o))};
  document.addEventListener("click",e=>{if(document.body.classList.contains("sheet-open")&&!e.target.closest(".top"))closeSheet()});
  $("#tocbtn2").onclick=()=>{setTab("libro");const pos=S.seq.findIndex(p=>p.type==="toc");flipTo(S.mode==="single"?pos:Math.ceil(pos/2))};
  $("#prev").onclick=prev;$("#next").onclick=next;
  $("#tocbtn").onclick=()=>{const pos=S.seq.findIndex(p=>p.type==="toc");flipTo(S.mode==="single"?pos:Math.ceil(pos/2))};
  bookEl.addEventListener("click",e=>{
    const t=e.target;
    const ask=t.closest("[data-ask]");if(ask){const n=ask.dataset.ask;ask.hidden=true;const c=bookEl.querySelectorAll(`[data-confirm="${n}"]`);c.forEach(x=>x.hidden=false);e.stopPropagation();return}
    const can=t.closest("[data-cancel]");if(can){const n=can.dataset.cancel;bookEl.querySelectorAll(`[data-confirm="${n}"]`).forEach(x=>x.hidden=true);bookEl.querySelectorAll(`[data-ask="${n}"]`).forEach(x=>x.hidden=false);e.stopPropagation();return}
    const un=t.closest("[data-unseal]");if(un){e.stopPropagation();unseal(+un.dataset.unseal);return}
    const gb=t.closest("[data-gobook]");if(gb){e.stopPropagation();goBook(+gb.dataset.gobook);return}
    if(t.closest("button,a,select,input"))return;
    const rect=bookEl.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width;
    if(S.mode==="single"){x<.35?prev():next()}else{if(S.cur===0)next();else if(S.cur===S.L)prev();else x<.5?prev():next()}
  });
  let sx=null,sy=null;
  bookEl.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});
  bookEl.addEventListener("pointerup",e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){dx<0?next():prev();bookEl.dataset.swiped="1";setTimeout(()=>delete bookEl.dataset.swiped,50)}sx=null});
  bookEl.addEventListener("click",e=>{if(bookEl.dataset.swiped)e.stopImmediatePropagation()},true);
  document.addEventListener("keydown",e=>{if(e.target.closest("input,select,textarea"))return;if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();next()}if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev()}});
  let rt=null,lastW=window.innerWidth,lastH=window.innerHeight;
  window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(window.innerWidth-lastW)<4&&Math.abs(window.innerHeight-lastH)<80)return;lastW=window.innerWidth;lastH=window.innerHeight;
    const [l,r]=visiblePages();const keep=(r||l)?(r||l).idx:0;computeSize();build();render(keep)},250)});
}

/* ---------- Arranque ---------- */
async function start(){
  setupSelect();
  computeSize();
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))])}catch(e){}
  build();
  const saved=store.get("pos",null);
  render(null);ribbon();wire();
  document.body.classList.add("ready");
  if(saved!=null&&saved>1){setTimeout(()=>{const pos=S.seq.findIndex(p=>p.idx>=saved);if(pos>0)flipTo(S.mode==="single"?pos:Math.ceil(pos/2))},500)}
  else setTimeout(()=>{if(S.cur===0)flipTo(1)},900);
  emitBook(S.mapBook);
}
start();
})();
</script>
<script>document.getElementById("msealico").innerHTML=window.CRW.seal("seal");</script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
